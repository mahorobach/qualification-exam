<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">自然冷媒ヒートポンプ給湯器</title><desc id="desc">屋外機と貯湯ユニットを持つCO2冷媒ヒートポンプ給湯器の自作イラスト。</desc><rect width="900" height="560" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111827"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs><text x="32" y="42" font-size="20" font-weight="700" fill="#111827">自然冷媒ヒートポンプ給湯器</text>
<text x="32" y="70" font-size="13" fill="#475569">主に屋外に設置され、機器内で二酸化炭素を冷媒として利用する給湯器。</text>
<rect x="470" y="130" width="160" height="330" rx="12" fill="#fff" stroke="#111827" stroke-width="4"/>
<line x1="470" y1="270" x2="630" y2="270" stroke="#cbd5e1" stroke-width="3"/><line x1="470" y1="360" x2="630" y2="360" stroke="#cbd5e1" stroke-width="3"/>
<rect x="510" y="158" width="44" height="24" fill="#e5e7eb" stroke="#64748b"/><text x="550" y="488" text-anchor="middle" font-size="17" font-weight="700">貯湯ユニット</text>
<rect x="160" y="300" width="220" height="130" rx="12" fill="#fff" stroke="#111827" stroke-width="4"/>
<circle cx="248" cy="365" r="48" fill="#e5e7eb" stroke="#64748b" stroke-width="3"/><path d="M220 365 q28 -44 56 0 q-28 44 -56 0" fill="none" stroke="#64748b" stroke-width="3"/><line x1="160" y1="330" x2="380" y2="330" stroke="#cbd5e1"/><text x="270" y="488" text-anchor="middle" font-size="17" font-weight="700">ヒートポンプユニット</text>
<path d="M380 345 C430 320 430 250 470 226" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/><path d="M470 410 C430 406 420 386 380 390" fill="none" stroke="#ef4444" stroke-width="4" marker-end="url(#arrow)"/>
