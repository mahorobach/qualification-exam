<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">張線器</title><desc id="desc">電線を引っ張って張力を調整する張線器の自作図。</desc><rect width="900" height="560" fill="#f8fafc"/><text x="32" y="46" font-size="22" font-weight="700" fill="#111827">写真に示す工具の名称</text><text x="32" y="76" font-size="14" fill="#475569">ワイヤグリップ、ラチェット本体、長い操作ハンドルを備える張線器。</text>
