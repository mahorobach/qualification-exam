<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">平行平板キャパシタの電界</title>
<desc id="desc">100Vを加えた平行平板キャパシタ。電極間距離d=1×10^-3m、電界Eを示す。</desc>
<rect width="760" height="520" fill="#f8fafc"/>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111827"/></marker>
<marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
</defs>
<text x="32" y="42" font-size="20" font-weight="700" fill="#111827">平行平板キャパシタの電界</text>

<text x="32" y="70" font-size="13" fill="#475569">電極間電圧 100V、距離 d = 1×10^-3 m</text>
<line x1="160" y1="160" x2="160" y2="390" stroke="#111827" stroke-width="3"/>
<line x1="160" y1="160" x2="290" y2="160" stroke="#111827" stroke-width="3"/>
<line x1="160" y1="390" x2="290" y2="390" stroke="#111827" stroke-width="3"/>
<line x1="138" y1="250" x2="182" y2="250" stroke="#111827" stroke-width="3"/>
<line x1="148" y1="272" x2="172" y2="272" stroke="#111827" stroke-width="3"/>
<text x="72" y="266" font-size="22" fill="#111827">100 V</text>
<polygon points="360,210 590,150 660,170 430,232" fill="#fff" stroke="#111827" stroke-width="3"/>
<polygon points="350,330 580,270 650,292 420,352" fill="#fff" stroke="#111827" stroke-width="3"/>
<line x1="290" y1="160" x2="450" y2="160" stroke="#111827" stroke-width="3"/>
<line x1="450" y1="160" x2="450" y2="184" stroke="#111827" stroke-width="3"/>
<line x1="290" y1="390" x2="450" y2="390" stroke="#111827" stroke-width="3"/>
<line x1="450" y1="390" x2="450" y2="348" stroke="#111827" stroke-width="3"/>
<line x1="330" y1="240" x2="330" y2="318" stroke="#111827" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="302" y="284" font-size="20" fill="#111827">d</text>
<line x1="510" y1="226" x2="510" y2="304" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
<text x="530" y="272" font-size="22" font-weight="700" fill="#2563eb">E [V/m]</text>

</svg>
