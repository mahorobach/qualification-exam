<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">低圧屋内幹線からの分岐回路</title>
<desc id="desc">幹線100A遮断器、VVR分岐回路の長さaと太さbの組合せ。</desc>
<rect width="760" height="520" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111827"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs>
<text x="32" y="42" font-size="20" font-weight="700" fill="#111827">低圧屋内幹線からの分岐回路</text>

<text x="32" y="70" font-size="13" fill="#475569">分岐点から配線用遮断器までをVVRで配線する。幹線側遮断器は100A。</text>
<text x="260" y="114" font-size="17">3φ3W 200V 電源</text>
<line x1="320" y1="132" x2="320" y2="320" stroke="#111827" stroke-width="5"/>
<rect x="298" y="176" width="44" height="44" fill="#fff" stroke="#111827" stroke-width="3"/><text x="320" y="205" text-anchor="middle" font-size="22">B</text>
<text x="356" y="188" font-size="16">定格電流</text><text x="356" y="208" font-size="16">100A</text>
<line x1="320" y1="250" x2="546" y2="250" stroke="#111827" stroke-width="5"/><text x="412" y="236" font-size="18">VVR</text>
<rect x="546" y="228" width="44" height="44" fill="#fff" stroke="#111827" stroke-width="3"/><text x="568" y="257" text-anchor="middle" font-size="22">B</text>
<line x1="590" y1="250" x2="676" y2="250" stroke="#111827" stroke-width="5"/>
<line x1="320" y1="290" x2="546" y2="290" stroke="#64748b" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="432" y="318" text-anchor="middle" font-size="20">a</text>
<rect x="180" y="350" width="400" height="122" fill="#fff" stroke="#111827" stroke-width="2"/>
<line x1="380" y1="350" x2="380" y2="472" stroke="#111827" stroke-width="2"/>
<line x1="180" y1="374" x2="580" y2="374" stroke="#111827" stroke-width="1.6"/><line x1="180" y1="398" x2="580" y2="398" stroke="#111827" stroke-width="1.6"/><line x1="180" y1="422" x2="580" y2="422" stroke="#111827" stroke-width="1.6"/><line x1="180" y1="446" x2="580" y2="446" stroke="#111827" stroke-width="1.6"/>
<text x="280" y="368" text-anchor="middle" font-size="15" font-weight="700">電線太さ b</text><text x="480" y="368" text-anchor="middle" font-size="15" font-weight="700">許容電流</text>
