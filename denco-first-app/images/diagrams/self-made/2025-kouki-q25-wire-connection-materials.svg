<g transform="translate(80 365)"><text x="0" y="0" font-size="22" font-weight="700">ハ</text><rect x="90" y="46" width="112" height="92" rx="46" fill="#e2e8f0" stroke="#111827" stroke-width="4"/><ellipse cx="146" cy="92" rx="34" ry="47" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="146" y="172" text-anchor="middle" font-size="16">リングスリーブ</text></g>
