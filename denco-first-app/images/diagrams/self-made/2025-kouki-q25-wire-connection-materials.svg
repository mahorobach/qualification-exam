<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">電線接続材料の4択</title><desc id="desc">電線の接続に使用しない材料を含む4つの自作図。</desc><rect width="900" height="620" fill="#f8fafc"/><text x="32" y="46" font-size="22" font-weight="700" fill="#111827">写真に示す材料のうち，電線の接続に使用しないもの</text><text x="32" y="76" font-size="14" fill="#475569">公式写真を転載せず、形状が判別できるように自作図で示す。</text>
<g transform="translate(80 135)"><text x="0" y="0" font-size="22" font-weight="700">イ</text><rect x="44" y="38" width="210" height="58" rx="28" fill="#e2e8f0" stroke="#111827" stroke-width="3"/><rect x="184" y="38" width="78" height="58" rx="8" fill="#cbd5e1" stroke="#111827" stroke-width="3"/><line x1="75" y1="44" x2="214" y2="90" stroke="#94a3b8" stroke-width="2"/><line x1="88" y1="90" x2="228" y2="44" stroke="#94a3b8" stroke-width="2"/><text x="150" y="142" text-anchor="middle" font-size="16">金属拡張アンカ</text></g>
