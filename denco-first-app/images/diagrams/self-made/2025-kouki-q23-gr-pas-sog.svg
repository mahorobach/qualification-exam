<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">GR付PAS（SOG）</title><desc id="desc">地絡継電装置付高圧交流負荷開閉器を自作図で示す。</desc><rect width="900" height="560" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs><text x="32" y="46" font-size="22" font-weight="700" fill="#111827">GR付PAS（SOG）の外観特徴</text><text x="32" y="76" font-size="14" fill="#475569">柱上に設置される高圧交流負荷開閉器。地絡時は波及事故防止のため動作協調をとる。</text>
<rect x="270" y="210" width="360" height="190" rx="24" fill="#fff" stroke="#111827" stroke-width="4"/><rect x="292" y="230" width="316" height="62" rx="10" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><text x="450" y="270" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">GR付 PAS</text><text x="450" y="332" text-anchor="middle" font-size="20" fill="#334155">SOG</text>
<g stroke="#111827" stroke-width="5" fill="none"><path d="M306 230c-70-54-124-56-180-20"/><path d="M380 230c-54-68-78-84-150-82"/><path d="M520 230c54-68 78-84 150-82"/><path d="M594 230c70-54 124-56 180-20"/></g>
<g fill="#fff" stroke="#111827" stroke-width="3"><rect x="300" y="174" width="48" height="48" rx="12"/><rect x="376" y="166" width="48" height="56" rx="12"/><rect x="476" y="166" width="48" height="56" rx="12"/><rect x="552" y="174" width="48" height="48" rx="12"/></g>
<line x1="450" y1="400" x2="450" y2="470" stroke="#111827" stroke-width="6"/><rect x="380" y="470" width="140" height="18" rx="6" fill="#111827"/><path d="M636 322h86" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text x="724" y="316" font-size="15" fill="#2563eb">短絡は遮断器で遮断</text><text x="724" y="340" font-size="15" fill="#2563eb">PAS単独ではない</text></svg>
