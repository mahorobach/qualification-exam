<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">ダイオード付き交流回路</title>
<desc id="desc">100V交流電源、ダイオード、10Ω抵抗の回路。ダイオード損失は無視。</desc>
<rect width="760" height="520" fill="#f8fafc"/>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111827"/></marker>
<marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
</defs>
<text x="32" y="42" font-size="20" font-weight="700" fill="#111827">ダイオード付き交流回路</text>

<text x="32" y="70" font-size="13" fill="#475569">ダイオードは半波整流として動作。抵抗は10Ω。</text>
<circle cx="175" cy="325" r="38" fill="#fff" stroke="#111827" stroke-width="3"/><text x="175" y="333" text-anchor="middle" font-size="24">〜</text><text x="80" y="333" font-size="21">100 V</text>
<line x1="175" y1="287" x2="175" y2="185" stroke="#111827" stroke-width="4"/>
<line x1="175" y1="185" x2="360" y2="185" stroke="#111827" stroke-width="4"/>
<polygon points="360,162 360,208 408,185" fill="#fff" stroke="#111827" stroke-width="4"/><line x1="410" y1="160" x2="410" y2="210" stroke="#111827" stroke-width="4"/>
<line x1="410" y1="185" x2="590" y2="185" stroke="#111827" stroke-width="4"/>
<line x1="590" y1="185" x2="590" y2="395" stroke="#111827" stroke-width="4"/>
<rect x="572" y="278" width="36" height="80" rx="4" fill="#fff" stroke="#111827" stroke-width="3"/><text x="624" y="325" font-size="20">10Ω</text>
<line x1="590" y1="395" x2="175" y2="395" stroke="#111827" stroke-width="4"/><line x1="175" y1="395" x2="175" y2="363" stroke="#111827" stroke-width="4"/>

</svg>
