<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">浮動充電方式の直流電源装置</title><desc id="desc">電源・整流器・蓄電池・負荷の接続構成4択を自作図で示す。</desc><rect width="900" height="560" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111827"/></marker><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker></defs><text x="32" y="42" font-size="20" font-weight="700" fill="#111827">浮動充電方式の直流電源装置</text>
<text x="32" y="70" font-size="13" fill="#475569">浮動充電では整流器が負荷へ給電しながら蓄電池を並列に充電する。</text>
<text x="70" y="120" font-size="20" font-weight="700">イ</text><circle cx="138" cy="162" r="22" fill="#fff" stroke="#111827" stroke-width="3"/><text x="138" y="169" text-anchor="middle" font-size="20">〜</text><text x="114" y="132" font-size="16">電源</text><rect x="86" y="194" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="138" y="219" text-anchor="middle" font-size="16">整流器</text><rect x="86" y="252" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="138" y="277" text-anchor="middle" font-size="16">蓄電池</text><rect x="86" y="310" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="138" y="335" text-anchor="middle" font-size="16">負荷</text><line x1="138" y1="184" x2="138" y2="348" stroke="#111827" stroke-width="3"/>
<text x="278" y="120" font-size="20" font-weight="700">ロ</text><circle cx="346" cy="162" r="22" fill="#fff" stroke="#111827" stroke-width="3"/><text x="346" y="169" text-anchor="middle" font-size="20">〜</text><text x="322" y="132" font-size="16">電源</text><rect x="294" y="194" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="346" y="219" text-anchor="middle" font-size="16">負荷</text><rect x="294" y="252" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="346" y="277" text-anchor="middle" font-size="16">整流器</text><rect x="294" y="310" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="346" y="335" text-anchor="middle" font-size="16">蓄電池</text><line x1="346" y1="184" x2="346" y2="348" stroke="#111827" stroke-width="3"/>
<text x="486" y="120" font-size="20" font-weight="700">ハ</text><circle cx="554" cy="162" r="22" fill="#fff" stroke="#111827" stroke-width="3"/><text x="554" y="169" text-anchor="middle" font-size="20">〜</text><text x="530" y="132" font-size="16">電源</text><rect x="502" y="194" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="554" y="219" text-anchor="middle" font-size="16">蓄電池</text><rect x="502" y="252" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="554" y="277" text-anchor="middle" font-size="16">整流器</text><rect x="502" y="310" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="554" y="335" text-anchor="middle" font-size="16">負荷</text><line x1="554" y1="184" x2="554" y2="348" stroke="#111827" stroke-width="3"/>
<text x="694" y="120" font-size="20" font-weight="700">ニ</text><circle cx="762" cy="162" r="22" fill="#fff" stroke="#111827" stroke-width="3"/><text x="762" y="169" text-anchor="middle" font-size="20">〜</text><text x="738" y="132" font-size="16">電源</text><rect x="710" y="194" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="762" y="219" text-anchor="middle" font-size="16">整流器</text><rect x="710" y="252" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="762" y="277" text-anchor="middle" font-size="16">蓄電池</text><rect x="710" y="310" width="104" height="38" rx="4" fill="#fff" stroke="#111827" stroke-width="2.5"/><text x="762" y="335" text-anchor="middle" font-size="16">負荷</text><line x1="762" y1="184" x2="762" y2="348" stroke="#111827" stroke-width="3"/>
<circle cx="778" cy="310" r="5" fill="#111827"/><circle cx="826" cy="310" r="5" fill="#111827"/><line x1="778" y1="310" x2="826" y2="310" stroke="#2563eb" stroke-width="4"/><text x="762" y="384" text-anchor="middle" font-size="13" fill="#2563eb">蓄電池は負荷側に並列</text>
</svg>
