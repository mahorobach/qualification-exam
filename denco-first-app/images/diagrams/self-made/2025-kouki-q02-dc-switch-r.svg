<text x="32" y="42" font-size="20" font-weight="700" fill="#111827">直流回路とスイッチS</text>

<text x="32" y="70" font-size="13" fill="#475569">S開のときR両端36V。Sを閉じた後のR両端電圧を求める。</text>
