<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
  <title id="title">単相3線式配電線路の電力損失</title>
  <desc id="desc">令和7年度第一種電気工事士下期学科試験 問7の学習用自作図。単相3線式配電線路で、各線抵抗0.4Ω、負荷Aと負荷Bはともに800W・力率0.8・負荷電圧100Vである。</desc>
  <rect width="760" height="520" fill="#f8fafc"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="32" y="38" font-size="20" font-weight="700" fill="#111827">単相3線式配電線路</text>
  <text x="32" y="64" font-size="13" fill="#475569">各線抵抗 0.4Ω、負荷A・Bは各 800W / 力率0.8 / 100V</text>

  <!-- Source label -->
  <text x="38" y="252" font-size="15" fill="#111827">1φ3W</text>
  <text x="45" y="274" font-size="15" fill="#111827">電源</text>

  <!-- Left terminals -->
  <circle cx="150" cy="134" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="150" cy="254" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/>
  <circle cx="150" cy="374" r="5" fill="#fff" stroke="#1f2937" stroke-width="2"/>

  <!-- Three conductors and line resistances -->
  <line x1="155" y1="134" x2="284" y2="134" stroke="#111827" stroke-width="3"/>
  <rect x="284" y="119" width="58" height="30" rx="4" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="313" y="139" text-anchor="middle" font-size="15" fill="#111827">0.4Ω</text>
  <line x1="342" y1="134" x2="498" y2="134" stroke="#111827" stroke-width="3"/>

  <line x1="155" y1="254" x2="284" y2="254" stroke="#111827" stroke-width="3"/>
  <rect x="284" y="239" width="58" height="30" rx="4" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="313" y="259" text-anchor="middle" font-size="15" fill="#111827">0.4Ω</text>
  <line x1="342" y1="254" x2="498" y2="254" stroke="#111827" stroke-width="3"/>

  <line x1="155" y1="374" x2="284" y2="374" stroke="#111827" stroke-width="3"/>
  <rect x="284" y="359" width="58" height="30" rx="4" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="313" y="379" text-anchor="middle" font-size="15" fill="#111827">0.4Ω</text>
  <line x1="342" y1="374" x2="498" y2="374" stroke="#111827" stroke-width="3"/>

  <!-- Distribution line span -->
  <line x1="150" y1="96" x2="498" y2="96" stroke="#334155" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="150" y1="86" x2="150" y2="106" stroke="#334155" stroke-width="1.6"/>
  <line x1="498" y1="86" x2="498" y2="106" stroke="#334155" stroke-width="1.6"/>
  <text x="324" y="88" text-anchor="middle" font-size="14" fill="#334155">配電線路</text>

  <!-- Load side vertical bus -->
  <line x1="498" y1="134" x2="498" y2="374" stroke="#111827" stroke-width="3"/>
  <circle cx="498" cy="134" r="5" fill="#111827"/>
  <circle cx="498" cy="254" r="5" fill="#111827"/>
  <circle cx="498" cy="374" r="5" fill="#111827"/>

  <!-- Loads -->
  <rect x="530" y="142" width="46" height="86" rx="4" fill="#fff" stroke="#111827" stroke-width="2"/>
  <path d="M553 150 v10 l-9 7 18 12 -18 12 18 12 -9 7 v10" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="498" y1="134" x2="553" y2="134" stroke="#111827" stroke-width="3"/>
  <line x1="553" y1="134" x2="553" y2="142" stroke="#111827" stroke-width="3"/>
  <line x1="553" y1="228" x2="553" y2="254" stroke="#111827" stroke-width="3"/>
  <line x1="498" y1="254" x2="553" y2="254" stroke="#111827" stroke-width="3"/>

  <rect x="530" y="282" width="46" height="86" rx="4" fill="#fff" stroke="#111827" stroke-width="2"/>
  <path d="M553 290 v10 l-9 7 18 12 -18 12 18 12 -9 7 v10" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <line x1="498" y1="254" x2="553" y2="254" stroke="#111827" stroke-width="3"/>
  <line x1="553" y1="254" x2="553" y2="282" stroke="#111827" stroke-width="3"/>
  <line x1="553" y1="368" x2="553" y2="374" stroke="#111827" stroke-width="3"/>
  <line x1="498" y1="374" x2="553" y2="374" stroke="#111827" stroke-width="3"/>

  <!-- Load labels -->
  <rect x="604" y="148" width="104" height="76" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="618" y="171" font-size="15" font-weight="700" fill="#111827">負荷A</text>
  <text x="618" y="194" font-size="14" fill="#334155">800 W</text>
  <text x="618" y="214" font-size="14" fill="#334155">力率 0.8</text>
  <rect x="604" y="288" width="104" height="76" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="618" y="311" font-size="15" font-weight="700" fill="#111827">負荷B</text>
  <text x="618" y="334" font-size="14" fill="#334155">800 W</text>
  <text x="618" y="354" font-size="14" fill="#334155">力率 0.8</text>

  <!-- Voltage arrows -->
  <line x1="462" y1="144" x2="462" y2="244" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="408" y="199" font-size="16" font-weight="700" fill="#2563eb">100 V</text>
  <line x1="462" y1="264" x2="462" y2="364" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="408" y="319" font-size="16" font-weight="700" fill="#2563eb">100 V</text>

  <!-- Current hints -->
  <path d="M190 116 H432" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="238" y="109" font-size="12" fill="#0f766e">上線電流</text>
  <path d="M432 392 H190" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="414" font-size="12" fill="#0f766e">下線電流</text>

  <!-- Note panel -->
  <rect x="32" y="434" width="696" height="54" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="456" font-size="13" font-weight="700" fill="#111827">図の読み取り</text>
  <text x="52" y="477" font-size="13" fill="#334155">電力損失は配電線路3本の抵抗 0.4Ω に流れる電流から求める。中性線電流は負荷A・Bの電流の差に注目する。</text>
</svg>
