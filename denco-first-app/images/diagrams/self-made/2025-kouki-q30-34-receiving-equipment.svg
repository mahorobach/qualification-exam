<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
<title id="title">高圧受電設備の共通図</title><desc id="desc">問い30から問い34で参照する受電設備を簡略化した自作図。</desc><rect width="1000" height="660" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111827"/></marker></defs><text x="32" y="42" font-size="22" font-weight="700" fill="#111827">問い30〜34 共通図（簡略）</text><text x="32" y="72" font-size="14" fill="#475569">高圧キャビネットから地下受電室のキュービクル式高圧受電設備へ至る電線路。</text>
<rect x="70" y="140" width="140" height="170" fill="#fff" stroke="#111827" stroke-width="3"/><text x="140" y="132" text-anchor="middle" font-size="16">高圧キャビネット</text><rect x="112" y="168" width="54" height="80" fill="none" stroke="#111827" stroke-dasharray="8 6" stroke-width="3"/><text x="205" y="190" font-size="18">UGS</text><circle cx="242" cy="225" r="24" fill="#fff" stroke="#111827" stroke-width="3"/><text x="242" y="233" text-anchor="middle" font-size="24">①</text><path d="M158 248v88c0 36 28 44 80 44h105" stroke="#111827" stroke-width="5" fill="none" stroke-dasharray="12 8" marker-end="url(#arrow)"/><circle cx="330" cy="380" r="24" fill="#fff" stroke="#111827" stroke-width="3"/><text x="330" y="388" text-anchor="middle" font-size="24">②</text><text x="250" y="410" font-size="15">高圧地中引込線</text>
<rect x="430" y="160" width="500" height="360" fill="#fff" stroke="#111827" stroke-width="4"/><text x="680" y="548" text-anchor="middle" font-size="20">受電室・受電設備</text><rect x="505" y="250" width="190" height="210" fill="#f8fafc" stroke="#111827" stroke-width="3"/><text x="600" y="284" text-anchor="middle" font-size="18">高圧受電盤</text><rect x="535" y="315" width="72" height="70" fill="#fff" stroke="#111827" stroke-width="3"/><text x="571" y="356" text-anchor="middle" font-size="18">VCT</text><rect x="622" y="315" width="52" height="70" fill="#fff" stroke="#111827" stroke-dasharray="8 5" stroke-width="3"/><text x="648" y="356" text-anchor="middle" font-size="18">LBS</text><rect x="735" y="210" width="150" height="90" fill="#fff" stroke="#111827" stroke-width="3"/><text x="810" y="260" text-anchor="middle" font-size="17">ケーブルラック</text><circle cx="790" cy="192" r="24" fill="#fff" stroke="#111827" stroke-width="3"/><text x="790" y="200" text-anchor="middle" font-size="24">④</text><rect x="735" y="350" width="150" height="92" fill="#fff" stroke="#111827" stroke-width="3"/><text x="810" y="388" text-anchor="middle" font-size="16">低圧盤</text><text x="810" y="414" text-anchor="middle" font-size="15">3φ / 1φ</text><circle cx="714" cy="350" r="24" fill="#fff" stroke="#111827" stroke-width="3"/><text x="714" y="358" text-anchor="middle" font-size="24">⑤</text><rect x="448" y="410" width="110" height="60" fill="#fff" stroke="#111827" stroke-width="3"/><text x="503" y="447" text-anchor="middle" font-size="15">接地端子盤</text><circle cx="405" cy="430" r="24" fill="#fff" stroke="#111827" stroke-width="3"/><text x="405" y="438" text-anchor="middle" font-size="24">③</text><path d="M343 380c46 0 67 18 88 56" stroke="#111827" stroke-width="5" fill="none" stroke-dasharray="12 8" marker-end="url(#arrow)"/><line x1="503" y1="470" x2="503" y2="600" stroke="#111827" stroke-width="4"/><line x1="452" y1="600" x2="554" y2="600" stroke="#111827" stroke-width="4"/><text x="575" y="606" font-size="16">接地極</text><text x="70" y="335" font-size="16">GL</text><line x1="60" y1="342" x2="930" y2="342" stroke="#94a3b8" stroke-width="3"/></svg>
