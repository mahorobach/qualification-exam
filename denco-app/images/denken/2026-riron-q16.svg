<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
  <title id="title">抵抗Rの接続を変更した二つの直流回路</title>
  <desc id="desc">図1は抵抗Rを端子aとdの間に接続し、図2は抵抗Rを端子bとcの間に接続している。</desc>
  <defs>
    <style>
      .wire{fill:none;stroke:#20242b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .resistor{fill:#fff;stroke:#20242b;stroke-width:2}
      .node{fill:#20242b}
      .label{fill:#20242b;font-family:"Times New Roman","Yu Mincho",serif;font-size:19px}
      .value{fill:#20242b;font-family:"Times New Roman","Yu Mincho",serif;font-size:18px}
      .caption{fill:#20242b;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:19px}
      .current{fill:none;stroke:#20242b;stroke-width:1.7;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#20242b"/>
    </marker>
  </defs>

  <!-- 図1 -->
  <g aria-label="図1">
    <!-- outer bridge -->
    <path class="wire" d="M78 152V67H128 M178 67H224 M274 67H300V152"/>
    <path class="wire" d="M78 152V237H128 M178 237H224 M274 237H300V152"/>
    <rect class="resistor" x="128" y="55" width="50" height="24"/>
    <rect class="resistor" x="224" y="55" width="50" height="24"/>
    <rect class="resistor" x="128" y="225" width="50" height="24"/>
    <rect class="resistor" x="224" y="225" width="50" height="24"/>

    <!-- middle branch R -->
    <path class="wire" d="M78 152H163 M213 152H300"/>
    <rect class="resistor" x="163" y="140" width="50" height="24"/>

    <!-- source loop -->
    <path class="wire" d="M78 152H56V315H175"/>
    <path class="wire" d="M201 315H322V152H300"/>
    <line class="wire" x1="175" y1="298" x2="175" y2="332"/>
    <line class="wire" x1="201" y1="305" x2="201" y2="325"/>

    <!-- nodes -->
    <circle class="node" cx="78" cy="152" r="4"/>
    <circle class="node" cx="201" cy="67" r="4"/>
    <circle class="node" cx="201" cy="237" r="4"/>
    <circle class="node" cx="300" cy="152" r="4"/>

    <!-- current arrows -->
    <path class="current" d="M91 130H147"/>
    <path class="current" d="M67 294V250"/>

    <!-- labels -->
    <text class="value" x="132" y="45">16 Ω</text>
    <text class="value" x="231" y="45">4 Ω</text>
    <text class="value" x="137" y="219">4 Ω</text>
    <text class="value" x="226" y="219">16 Ω</text>
    <text class="label" x="179" y="181" font-style="italic">R</text>
    <text class="value" x="198" y="181">[Ω]</text>
    <text class="label" x="67" y="143">a</text>
    <text class="label" x="196" y="54">b</text>
    <text class="label" x="196" y="262">c</text>
    <text class="label" x="306" y="143">d</text>
    <text class="label" x="97" y="120" font-style="italic">I</text>
    <text class="value" x="104" y="125" font-size="13">2</text>
    <text class="value" x="116" y="120">= 0.5 A</text>
    <text class="label" x="75" y="277" font-style="italic">I</text>
    <text class="value" x="82" y="282" font-size="13">1</text>
    <text class="value" x="94" y="277">= 4.5 A</text>
    <text class="label" x="168" y="352" font-style="italic">E</text>
    <text class="value" x="183" y="352">[V]</text>
    <text class="caption" x="166" y="395">図1</text>
  </g>

  <!-- 図2 -->
  <g aria-label="図2">
    <!-- bridge -->
    <path class="wire" d="M437 152V67H487 M537 67H583 M633 67H659V152"/>
    <path class="wire" d="M437 152V237H487 M537 237H583 M633 237H659V152"/>
    <rect class="resistor" x="487" y="55" width="50" height="24"/>
    <rect class="resistor" x="583" y="55" width="50" height="24"/>
    <rect class="resistor" x="487" y="225" width="50" height="24"/>
    <rect class="resistor" x="583" y="225" width="50" height="24"/>

    <!-- vertical branch R -->
    <path class="wire" d="M560 67V126 M560 178V237"/>
    <rect class="resistor" x="548" y="126" width="24" height="52"/>

    <!-- source loop -->
    <path class="wire" d="M437 152H415V315H534"/>
    <path class="wire" d="M560 315H681V152H659"/>
    <line class="wire" x1="534" y1="298" x2="534" y2="332"/>
    <line class="wire" x1="560" y1="305" x2="560" y2="325"/>

    <!-- nodes -->
    <circle class="node" cx="437" cy="152" r="4"/>
    <circle class="node" cx="560" cy="67" r="4"/>
    <circle class="node" cx="560" cy="237" r="4"/>
    <circle class="node" cx="659" cy="152" r="4"/>

    <!-- current arrow -->
    <path class="current" d="M426 294V250"/>

    <!-- labels -->
    <text class="value" x="491" y="45">16 Ω</text>
    <text class="value" x="590" y="45">4 Ω</text>
    <text class="value" x="496" y="219">4 Ω</text>
    <text class="value" x="585" y="219">16 Ω</text>
    <text class="label" x="579" y="151" font-style="italic">R</text>
    <text class="value" x="593" y="151">[Ω]</text>
    <text class="label" x="426" y="143">a</text>
    <text class="label" x="555" y="54">b</text>
    <text class="label" x="555" y="262">c</text>
    <text class="label" x="665" y="143">d</text>
    <text class="label" x="434" y="277" font-style="italic">I</text>
    <text class="value" x="441" y="282" font-size="13">3</text>
    <text class="value" x="453" y="277">[A]</text>
    <text class="label" x="527" y="352" font-style="italic">E</text>
    <text class="value" x="542" y="352">[V]</text>
    <text class="caption" x="525" y="395">図2</text>
  </g>
</svg>
