<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
  <title id="title">Self-made outlet box identification icon</title>
  <desc id="desc">Original simplified icon for identifying an outlet box by its square metal box shape and knockout holes. This is not copied from official exam photos.</desc>
  <rect width="820" height="460" fill="#fff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" fill="#111827">
    <text x="54" y="54" font-size="24" font-weight="700">アウトレットボックスの識別ポイント（自作アイコン）</text>
  </g>
  <g transform="translate(90 92)">
    <rect x="0" y="0" width="280" height="250" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="5"/>
    <rect x="22" y="22" width="236" height="206" rx="10" fill="#eef2f7" stroke="#111827" stroke-width="3"/>
    <circle cx="74" cy="74" r="26" fill="#fff" stroke="#111827" stroke-width="4"/>
    <circle cx="206" cy="74" r="26" fill="#fff" stroke="#111827" stroke-width="4"/>
    <circle cx="74" cy="176" r="26" fill="#fff" stroke="#111827" stroke-width="4"/>
    <circle cx="206" cy="176" r="26" fill="#fff" stroke="#111827" stroke-width="4"/>
    <circle cx="140" cy="125" r="18" fill="#fff" stroke="#111827" stroke-width="4"/>
    <path d="M50 30h46M184 30h46M50 220h46M184 220h46" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" fill="#111827">
    <path d="M390 156h78" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <path d="M468 156l-16 -14M468 156l-16 14" stroke="#2563eb" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="488" y="150" font-size="22" font-weight="700">金属製の四角い箱</text>
    <text x="488" y="182" font-size="17" fill="#374151">スイッチ・コンセント取付けや接続箇所に使う</text>
    <path d="M290 168c48 40 88 66 168 90" stroke="#2563eb" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M458 258l-20 -4M458 258l-13 -16" stroke="#2563eb" stroke-width="4" stroke-linecap="round" fill="none"/>
    <text x="488" y="258" font-size="22" font-weight="700">KOの打抜き穴</text>
    <text x="488" y="290" font-size="17" fill="#374151">電線管などを接続するための丸い打抜き部</text>
    <text x="54" y="404" font-size="15">注: 識別特徴を覚えるための独自SVGアイコン。公式写真・公式図面は使用していません。</text>
  </g>
</svg>
