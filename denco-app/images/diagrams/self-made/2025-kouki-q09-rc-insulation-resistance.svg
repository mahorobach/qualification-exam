<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" style="max-width:640px" font-family="sans-serif">
  <desc>2025年度下期 問題9用。配線図中の⑨、ベランダの単相200Vルームエアコン回路と絶縁抵抗基準を読み取りやすくした学習用拡大図。</desc>
  <rect width="640" height="520" fill="#f9f9f6"/>

  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="28" y="36" font-size="18" font-weight="bold" fill="#1f2937">配線図 ⑨ 拡大図</text>
  <text x="28" y="60" font-size="12" fill="#4b5563">ベランダのルームエアコン回路（単相200V）の絶縁抵抗を確認する図</text>

  <!-- Main balcony crop -->
  <rect x="36" y="92" width="398" height="344" rx="4" fill="#eef9ff" stroke="#4488aa" stroke-width="1.6"/>
  <text x="235" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#336f8d">2階 ベランダ</text>

  <!-- 200V feeder -->
  <line x1="184" y1="92" x2="184" y2="184" stroke="#0000cc" stroke-width="2.4" stroke-dasharray="9,5"/>
  <line x1="184" y1="184" x2="278" y2="184" stroke="#0000cc" stroke-width="2.4" stroke-dasharray="9,5"/>
  <line x1="278" y1="184" x2="278" y2="222" stroke="#0000cc" stroke-width="2.4" stroke-dasharray="9,5"/>

  <!-- RC unit -->
  <g filter="url(#soft-shadow)">
    <rect x="218" y="222" width="120" height="66" rx="5" fill="white" stroke="#0000cc" stroke-width="2"/>
    <rect x="244" y="242" width="68" height="28" rx="3" fill="#eef2ff" stroke="#0000cc" stroke-width="1.6"/>
    <text x="278" y="262" text-anchor="middle" font-size="14" fill="#0000cc">RC</text>
  </g>
  <text x="222" y="318" font-size="16" font-weight="bold" fill="#0000cc">単相200V 20A</text>

  <!-- Target marker -->
  <circle cx="366" cy="214" r="20" fill="#e8f8ff" stroke="#0000cc" stroke-width="2.2"/>
  <text x="366" y="221" text-anchor="middle" font-size="18" font-weight="bold" fill="#0000cc">⑨</text>
  <line x1="338" y1="242" x2="350" y2="230" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Ground reference -->
  <line x1="116" y1="354" x2="354" y2="354" stroke="#15803d" stroke-width="2"/>
  <line x1="156" y1="368" x2="314" y2="368" stroke="#15803d" stroke-width="2"/>
  <line x1="196" y1="382" x2="274" y2="382" stroke="#15803d" stroke-width="2"/>
  <text x="116" y="410" font-size="12" fill="#15803d">大地（接地側）</text>
  <line x1="278" y1="288" x2="244" y2="354" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="274" y="354" font-size="12" fill="#4b5563">絶縁抵抗を確認</text>

  <!-- Callout -->
  <path d="M458 122 H594 Q606 122 606 134 V268 Q606 280 594 280 H458 Q446 280 446 268 V134 Q446 122 458 122 Z" fill="#fffdf3" stroke="#d6a300" stroke-width="1.6"/>
  <text x="472" y="150" font-size="14" font-weight="bold" fill="#374151">読み取りポイント</text>
  <text x="472" y="178" font-size="13" fill="#374151">⑨は単相200V回路。</text>
  <text x="472" y="201" font-size="13" fill="#374151">対地電圧が150Vを</text>
  <text x="472" y="224" font-size="13" fill="#374151">超えるので、</text>
  <text x="472" y="247" font-size="13" font-weight="bold" fill="#0000cc">最小 0.2 MΩ</text>
  <line x1="446" y1="196" x2="338" y2="250" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Small criteria table -->
  <rect x="458" y="312" width="148" height="112" rx="4" fill="white" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="532" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">絶縁抵抗の基準</text>
  <line x1="468" y1="344" x2="596" y2="344" stroke="#d1d5db" stroke-width="1"/>
  <text x="472" y="365" font-size="11" fill="#4b5563">150V以下</text>
  <text x="558" y="365" text-anchor="middle" font-size="11" fill="#4b5563">0.1MΩ</text>
  <rect x="464" y="376" width="136" height="28" rx="3" fill="#eef2ff" stroke="#3355aa" stroke-width="1"/>
  <text x="472" y="395" font-size="11" font-weight="bold" fill="#3355aa">150V超</text>
  <text x="558" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#3355aa">0.2MΩ</text>
  <text x="472" y="418" font-size="11" fill="#4b5563">300V超</text>
  <text x="558" y="418" text-anchor="middle" font-size="11" fill="#4b5563">0.4MΩ</text>

  <!-- Legend -->
  <line x1="36" y1="466" x2="82" y2="466" stroke="#0000cc" stroke-width="2.4" stroke-dasharray="9,5"/>
  <text x="92" y="470" font-size="11" fill="#4b5563">単相200V回路</text>
  <rect x="218" y="452" width="44" height="28" rx="3" fill="white" stroke="#0000cc" stroke-width="1.4"/>
  <text x="240" y="471" text-anchor="middle" font-size="11" fill="#0000cc">RC</text>
  <text x="276" y="470" font-size="11" fill="#4b5563">ルームエアコン</text>
  <line x1="406" y1="466" x2="452" y2="466" stroke="#15803d" stroke-width="2"/>
  <text x="462" y="470" font-size="11" fill="#4b5563">大地</text>
</svg>
