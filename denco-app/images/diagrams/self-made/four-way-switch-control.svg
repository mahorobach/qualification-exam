<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
  <title id="title">Self-made four-way switch control diagram</title>
  <desc id="desc">An original schematic showing one lamp controlled from three locations with two three-way switches and one four-way switch. This is not a trace of an official exam drawing.</desc>
  <rect width="980" height="440" fill="#fff"/>
  <g fill="none" stroke="#111827" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="70" y1="95" x2="190" y2="95"/>
    <line x1="70" y1="325" x2="840" y2="325"/>
    <rect x="190" y="62" width="92" height="100" rx="10"/>
    <rect x="430" y="62" width="120" height="100" rx="10"/>
    <rect x="700" y="62" width="92" height="100" rx="10"/>
    <line x1="282" y1="95" x2="430" y2="95"/>
    <line x1="282" y1="130" x2="430" y2="130"/>
    <line x1="550" y1="95" x2="700" y2="95"/>
    <line x1="550" y1="130" x2="700" y2="130"/>
    <line x1="792" y1="95" x2="850" y2="95"/>
    <line x1="850" y1="95" x2="850" y2="185"/>
    <circle cx="850" cy="225" r="40"/>
    <line x1="822" y1="197" x2="878" y2="253"/>
    <line x1="878" y1="197" x2="822" y2="253"/>
    <line x1="850" y1="265" x2="850" y2="325"/>
    <line x1="220" y1="95" x2="252" y2="130"/>
    <line x1="730" y1="95" x2="762" y2="95"/>
    <line x1="462" y1="95" x2="520" y2="130"/>
    <line x1="462" y1="130" x2="520" y2="95"/>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" fill="#111827">
    <text x="60" y="48" font-size="24" font-weight="700">3か所から1灯を操作する自作模式図</text>
    <text x="68" y="88" font-size="16">非接地側</text>
    <text x="68" y="318" font-size="16">接地側</text>
    <text x="196" y="190" font-size="18" font-weight="700">3路SW</text>
    <text x="446" y="190" font-size="18" font-weight="700">4路SW</text>
    <text x="706" y="190" font-size="18" font-weight="700">3路SW</text>
    <text x="820" y="290" font-size="18" font-weight="700">照明</text>
    <text x="60" y="390" font-size="15">注: 接続関係の理解用に作成した独自図面。公式試験図面のトレースではありません。</text>
  </g>
</svg>
