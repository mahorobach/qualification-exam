<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="title desc">
  <title id="title">2024年後期 問題17 ⑨三相動力コンセント</title>
  <desc id="desc">2024年度後期配線図の⑨に示す三相3線式200V動力回路のコンセント位置を読み取りやすくした学習用自作図。刃受配置の正解形状は図示しない。</desc>
  <style>text{font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif}.area{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}.panel{fill:#fee2e2;stroke:#7f1d1d;stroke-width:1.5}.wire{stroke:#111827;stroke-width:3;fill:none}.symbol{fill:#fff;stroke:#111827;stroke-width:2.4}.mark{fill:#fff;stroke:#2563eb;stroke-width:3}.num{font-size:18px;font-weight:700;fill:#1d4ed8;text-anchor:middle;dominant-baseline:central}.small{font-size:12px;fill:#475569}.label{font-size:15px;fill:#334155}.title{font-size:20px;font-weight:700;fill:#0f172a;text-anchor:middle}</style>
  <rect width="760" height="460" fill="#fff"/>
  <rect x="28" y="22" width="704" height="58" rx="10" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="380" y="47" class="title">2024年度後期 配線図（学習用模式図）</text>
  <text x="380" y="69" text-anchor="middle" class="small">⑨の三相3線式200V動力回路コンセントを確認するための整理図</text>
  <rect x="88" y="116" width="470" height="220" rx="4" class="area"/>
  <rect x="160" y="154" width="66" height="30" rx="3" class="panel"/><text x="193" y="174" text-anchor="middle" font-size="14" fill="#7f1d1d">P-1</text>
  <path d="M226 169 C300 180 348 210 392 248" class="wire"/>
  <circle cx="410" cy="262" r="30" class="symbol"/>
  <text x="410" y="268" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">3φ</text>
  <text x="410" y="308" text-anchor="middle" class="small">200V 動力回路</text>
  <circle cx="365" cy="248" r="18" class="mark"/><text x="365" y="248" class="num">⑨</text>
  <rect x="84" y="380" width="592" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="116" cy="404" r="14" class="mark"/><text x="116" y="404" class="num" font-size="15">⑨</text>
  <text x="146" y="409" class="label" font-weight="700">対象位置</text>
  <text x="242" y="409" class="small">三相3線式200Vの動力回路に接続されるコンセント。刃受配置は選択肢から判断する。</text>
</svg>
