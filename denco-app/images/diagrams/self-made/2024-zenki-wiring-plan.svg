<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680" width="620" height="680">
  <desc>2024年度前期 配線図 学習用自作模式図。公式図面のトレースではない独自設計。建物種別：鉄骨軽量コンクリート造 単層店舗兼事務所。</desc>
  <style>
    text { font-family: sans-serif; }
    .room { fill: #f8f8f4; stroke: #555; stroke-width: 2; }
    .outdoor { fill: #eef5ee; stroke: #888; stroke-width: 1.5; }
    .panel { fill: #ddd; stroke: #444; stroke-width: 2; }
    .wire { stroke: #222; stroke-width: 1.5; fill: none; }
    .wire2 { stroke: #222; stroke-width: 2.5; fill: none; }
    .dash { stroke: #444; stroke-width: 1.5; fill: none; stroke-dasharray: 6,3; }
    .sym { fill: white; stroke: #111; stroke-width: 1.5; }
    .nc { fill: white; stroke: #000; stroke-width: 1.5; }
    .nt { font-size: 8.5px; font-weight: bold; fill: #000; text-anchor: middle; dominant-baseline: central; }
    .rt { font-size: 9px; fill: #222; }
    .rb { font-size: 10px; font-weight: bold; fill: #111; text-anchor: middle; }
    .rs { font-size: 8px; fill: #444; }
    .rc { font-size: 7.5px; fill: #333; text-anchor: middle; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="620" height="680" fill="#fff"/>

  <!-- Title -->
  <rect x="0" y="0" width="620" height="34" fill="#2a5298"/>
  <text x="310" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="white">2024年度前期 配線図（学習用模式図）</text>
  <text x="310" y="28" text-anchor="middle" font-size="8" fill="#dbeafe">鉄骨軽量コンクリート造 単層店舗兼事務所</text>

  <!-- ===== BUILDING ===== -->
  <!-- Main building outer wall -->
  <rect x="18" y="38" width="400" height="330" class="room" rx="3"/>

  <!-- 事務所 partition (top-left) -->
  <rect x="18" y="38" width="170" height="170" fill="#f0f0f8" stroke="#555" stroke-width="2"/>
  <text x="103" y="65" class="rb">事務所</text>

  <!-- 手洗い (small, top-center) -->
  <rect x="188" y="38" width="80" height="80" fill="#e8f0f8" stroke="#555" stroke-width="1.5"/>
  <text x="228" y="80" class="rc" font-size="9px">手洗い</text>

  <!-- 冷蔵庫コーナー (top-right inside) -->
  <rect x="268" y="38" width="150" height="170" fill="#f0f8f0" stroke="#555" stroke-width="1.5"/>
  <text x="343" y="65" class="rb" font-size="9px">冷蔵庫コーナー</text>

  <!-- 店舗 (large lower area) -->
  <rect x="18" y="208" width="400" height="160" fill="#fafaf5" stroke="#555" stroke-width="1.5"/>
  <text x="218" y="255" class="rb">店　舗</text>
  <text x="218" y="272" class="rc" font-size="9px">（商品棚）</text>

  <!-- 出入口 -->
  <rect x="148" y="368" width="100" height="24" fill="#ccc" stroke="#888" stroke-width="1"/>
  <text x="198" y="383" class="rc" font-size="9px" fill="#333">出入口</text>

  <!-- ===== 駐車場 (outside right) ===== -->
  <rect x="428" y="38" width="178" height="330" class="outdoor" rx="3"/>
  <text x="517" y="200" class="rb" fill="#444">駐 車 場</text>

  <!-- ===== POWER SYSTEM (top) ===== -->
  <!-- 引込線 from top -->
  <line x1="310" y1="0" x2="310" y2="38" class="wire2"/>
  <text x="160" y="14" font-size="8px" fill="white">3φ3W 200V / 1φ3W 100/200V</text>
  <!-- ⑩ 引込点 -->
  <circle cx="310" cy="9" r="9" class="nc"/>
  <text x="310" y="9" class="nt">⑩</text>

  <!-- 電灯分電盤 (center-top area) -->
  <rect x="258" y="42" width="46" height="22" class="panel" rx="2"/>
  <text x="281" y="52" class="rc" font-size="8px">電灯盤</text>
  <text x="281" y="60" class="rc" font-size="7px">1φ3W</text>

  <!-- 動力分電盤 (right, outside) -->
  <rect x="438" y="42" width="46" height="22" class="panel" rx="2"/>
  <text x="461" y="52" class="rc" font-size="8px">動力盤</text>
  <text x="461" y="60" class="rc" font-size="7px">3φ3W</text>

  <!-- Feeder wires from 引込 to boards -->
  <line x1="310" y1="38" x2="281" y2="42" class="wire"/>
  <line x1="310" y1="38" x2="461" y2="42" class="wire2"/>

  <!-- ===== NUMBERED POSITIONS ===== -->

  <!-- ① リモコントランス (事務所内) -->
  <rect x="68" y="100" width="30" height="16" class="sym"/>
  <text x="83" y="109" class="rc" font-size="8px">RT</text>
  <line x1="68" y1="108" x2="58" y2="108" class="wire"/>
  <circle cx="48" cy="108" r="9" class="nc"/>
  <text x="48" y="108" class="nt">①</text>

  <!-- ② 天井コンセント (事務所内 天井面取付) -->
  <circle cx="130" cy="150" r="7" class="sym"/>
  <line x1="123" y1="150" x2="137" y2="150" stroke="#111" stroke-width="1"/>
  <line x1="130" y1="143" x2="130" y2="157" stroke="#111" stroke-width="1"/>
  <circle cx="110" cy="150" r="9" class="nc"/>
  <text x="110" y="150" class="nt">②</text>

  <!-- ③ 接地極付きコンセント (店舗内) -->
  <rect x="68" y="290" width="14" height="18" class="sym"/>
  <line x1="75" y1="308" x2="75" y2="312" stroke="#111" stroke-width="1"/>
  <text x="75" y="320" class="rc" font-size="7.5px">E</text>
  <circle cx="55" cy="300" r="9" class="nc"/>
  <text x="55" y="300" class="nt">③</text>

  <!-- ④ 誘導灯 (出入口付近) -->
  <rect x="178" y="350" width="20" height="14" class="sym"/>
  <text x="188" y="360" class="rc" font-size="8px" text-anchor="middle">→</text>
  <circle cx="163" cy="357" r="9" class="nc"/>
  <text x="163" y="357" class="nt">④</text>

  <!-- ⑤ VE28配管 (構内地下) -->
  <line x1="40" y1="470" x2="580" y2="470" class="dash"/>
  <text x="310" y="465" class="rc" font-size="8px" text-anchor="middle">600V CV 5.5-2C (VE28)</text>
  <circle cx="80" cy="470" r="9" class="nc"/>
  <text x="80" y="470" class="nt">⑤</text>

  <!-- ⑥ 接地端子付コンセント ET (冷蔵庫回路) -->
  <rect x="308" y="115" width="14" height="18" class="sym"/>
  <text x="315" y="140" class="rc" font-size="7.5px">ET</text>
  <circle cx="293" cy="125" r="9" class="nc"/>
  <text x="293" y="125" class="nt">⑥</text>

  <!-- ⑦ BE漏電遮断器 (電灯盤出力) -->
  <rect x="243" y="68" width="20" height="12" class="sym"/>
  <text x="253" y="76" class="rc" font-size="7.5px">BE</text>
  <circle cx="232" cy="74" r="9" class="nc"/>
  <text x="232" y="74" class="nt">⑦</text>

  <!-- ⑧ 三相回路 空調機 (冷蔵庫コーナー) -->
  <circle cx="390" cy="120" r="12" class="sym"/>
  <text x="390" y="120" class="rc" font-size="9px" text-anchor="middle">M</text>
  <text x="390" y="138" class="rc" font-size="7.5px" text-anchor="middle">空調機</text>
  <circle cx="370" cy="110" r="9" class="nc"/>
  <text x="370" y="110" class="nt">⑧</text>

  <!-- ⑨ 動力盤内 漏電遮断器 (BE 3P) -->
  <rect x="450" y="68" width="22" height="13" class="sym"/>
  <text x="461" y="77" class="rc" font-size="7px">BE 3P</text>
  <circle cx="439" cy="75" r="9" class="nc"/>
  <text x="439" y="75" class="nt">⑨</text>

  <!-- Wire from 電灯盤 down through building -->
  <line x1="281" y1="64" x2="103" y2="90" class="wire"/>
  <line x1="281" y1="64" x2="281" y2="220" class="wire"/>
  <line x1="461" y1="64" x2="390" y2="108" class="wire2"/>

  <!-- ⑪ ジョイントボックス差込形 (事務所-店舗境界) -->
  <rect x="125" y="205" width="16" height="16" fill="#e8e8ff" stroke="#000" stroke-width="1.5"/>
  <circle cx="110" cy="213" r="9" class="nc"/>
  <text x="110" y="213" class="nt">⑪</text>

  <!-- ⑫ カップリング (配管接続部) -->
  <circle cx="200" cy="100" r="5" class="sym"/>
  <line x1="170" y1="100" x2="195" y2="100" class="wire"/>
  <line x1="205" y1="100" x2="240" y2="100" class="wire"/>
  <circle cx="182" cy="100" r="9" class="nc"/>
  <text x="182" y="100" class="nt">⑫</text>

  <!-- ⑬ 硬質ポリ塩化ビニル電線管部 -->
  <line x1="460" y1="140" x2="520" y2="140" stroke="#555" stroke-width="3"/>
  <text x="490" y="155" class="rc" font-size="7.5px" text-anchor="middle">VE管</text>
  <circle cx="445" cy="140" r="9" class="nc"/>
  <text x="445" y="140" class="nt">⑬</text>

  <!-- ⑭ タイムスイッチ TS -->
  <rect x="253" y="82" width="18" height="12" class="sym"/>
  <text x="262" y="90" class="rc" font-size="7.5px">TS</text>
  <circle cx="242" cy="88" r="9" class="nc"/>
  <text x="242" y="88" class="nt">⑭</text>

  <!-- ⑮ 漏れ電流測定位置 (測定点マーク) -->
  <circle cx="461" cy="180" r="6" fill="white" stroke="#000" stroke-width="1"/>
  <line x1="461" y1="174" x2="461" y2="186" stroke="#000" stroke-width="1"/>
  <text x="461" y="193" class="rc" font-size="7.5px" text-anchor="middle">測定</text>
  <circle cx="445" cy="180" r="9" class="nc"/>
  <text x="445" y="180" class="nt">⑮</text>

  <!-- ⑯ E5.5接地線 (電灯盤そば) -->
  <line x1="281" y1="64" x2="281" y2="78" class="wire"/>
  <line x1="271" y1="78" x2="291" y2="78" stroke="#000" stroke-width="1.8"/>
  <line x1="274" y1="81" x2="288" y2="81" stroke="#000" stroke-width="1.2"/>
  <line x1="277" y1="84" x2="285" y2="84" stroke="#000" stroke-width="0.8"/>
  <text x="295" y="80" class="rt" font-size="7.5px">E5.5</text>
  <circle cx="261" cy="78" r="9" class="nc"/>
  <text x="261" y="78" class="nt">⑯</text>

  <!-- ⑰ リモコンセレクタスイッチ RC No1 -->
  <rect x="118" y="48" width="22" height="14" class="sym"/>
  <text x="129" y="57" class="rc" font-size="7.5px">RC</text>
  <text x="129" y="65" class="rc" font-size="7px">No1</text>
  <circle cx="106" cy="55" r="9" class="nc"/>
  <text x="106" y="55" class="nt">⑰</text>

  <!-- ⑱ ジョイントボックス リングスリーブ接続 (店舗中央) -->
  <rect x="185" y="283" width="16" height="16" fill="#fff8e0" stroke="#000" stroke-width="1.5"/>
  <circle cx="170" cy="291" r="9" class="nc"/>
  <text x="170" y="291" class="nt">⑱</text>

  <!-- ⑲ ジョイントボックス リングスリーブ接続 (出入口付近) -->
  <rect x="265" y="347" width="16" height="16" fill="#fff8e0" stroke="#000" stroke-width="1.5"/>
  <circle cx="250" cy="355" r="9" class="nc"/>
  <text x="250" y="355" class="nt">⑲</text>

  <!-- ⑳ 壁面コンセント群 (店舗右壁) -->
  <rect x="393" y="285" width="14" height="18" class="sym"/>
  <text x="400" y="308" class="rc" font-size="7.5px">ET</text>
  <text x="400" y="316" class="rc" font-size="7px">20A</text>
  <circle cx="380" cy="295" r="9" class="nc"/>
  <text x="380" y="295" class="nt">⑳</text>

  <!-- Various connecting wires -->
  <line x1="103" y1="90" x2="103" y2="108" class="wire"/>
  <line x1="133" y1="108" x2="200" y2="108" class="wire"/>
  <line x1="103" y1="108" x2="133" y2="108" class="wire"/>
  <line x1="103" y1="108" x2="103" y2="145" class="wire"/>
  <line x1="103" y1="145" x2="119" y2="145" class="wire"/>
  <line x1="133" y1="145" x2="103" y2="180" class="wire"/>
  <line x1="103" y1="180" x2="103" y2="213" class="wire"/>
  <line x1="103" y1="213" x2="133" y2="213" class="wire"/>
  <line x1="133" y1="213" x2="193" y2="213" class="wire"/>
  <line x1="193" y1="213" x2="193" y2="291" class="wire"/>
  <line x1="193" y1="291" x2="193" y2="355" class="wire"/>
  <line x1="193" y1="291" x2="193" y2="291" class="wire"/>
  <line x1="281" y1="220" x2="281" y2="310" class="wire"/>
  <line x1="75" y1="300" x2="75" y2="250" class="wire"/>
  <line x1="75" y1="250" x2="193" y2="213" class="wire"/>

  <!-- ===== DISTRIBUTION BOARD DIAGRAMS (bottom) ===== -->
  <rect x="12" y="495" width="290" height="130" fill="#f9f9f9" stroke="#888" stroke-width="1" rx="3"/>
  <text x="157" y="510" class="rb" font-size="9px">電灯分電盤 結線図（単線図）</text>
  <text x="22" y="524" class="rt" font-size="8px">1φ3W 100/200V 屋外→屋内</text>
  <!-- Main breaker -->
  <rect x="22" y="530" width="22" height="14" fill="#ddd" stroke="#555" stroke-width="1"/>
  <text x="33" y="539" class="rc" font-size="7px">B 3P100A</text>
  <!-- Branch breakers simplified -->
  <line x1="33" y1="544" x2="33" y2="556" stroke="#000" stroke-width="1.5"/>
  <line x1="33" y1="556" x2="285" y2="556" stroke="#000" stroke-width="1.5"/>
  <text x="50" y="570" class="rc" font-size="7.5px">BE BE BE BE BE BE BE BE</text>
  <text x="50" y="582" class="rc" font-size="7px">30A 20A 20A 20A 20A 20A 20A 20A</text>
  <!-- TS -->
  <rect x="200" y="586" width="14" height="9" fill="white" stroke="#555" stroke-width="1"/>
  <text x="207" y="593" class="rc" font-size="6.5px">TS</text>
  <!-- RC -->
  <rect x="85" y="586" width="14" height="9" fill="white" stroke="#555" stroke-width="1"/>
  <text x="92" y="593" class="rc" font-size="6.5px">RC</text>
  <rect x="107" y="586" width="14" height="9" fill="white" stroke="#555" stroke-width="1"/>
  <text x="114" y="593" class="rc" font-size="6.5px">RC</text>
  <!-- E接地 -->
  <line x1="33" y1="608" x2="33" y2="615" stroke="#000" stroke-width="1.5"/>
  <line x1="26" y1="615" x2="40" y2="615" stroke="#000" stroke-width="1.5"/>
  <line x1="28" y1="618" x2="38" y2="618" stroke="#000" stroke-width="1"/>
  <text x="45" y="616" class="rc" font-size="7px">E5.5</text>

  <rect x="316" y="495" width="292" height="130" fill="#f9f9f9" stroke="#888" stroke-width="1" rx="3"/>
  <text x="462" y="510" class="rb" font-size="9px">動力分電盤 結線図（単線図）</text>
  <text x="326" y="524" class="rt" font-size="8px">3φ3W 200V 屋外→屋内</text>
  <rect x="326" y="530" width="22" height="14" fill="#ddd" stroke="#555" stroke-width="1"/>
  <text x="337" y="539" class="rc" font-size="7px">B 3P60A</text>
  <line x1="337" y1="544" x2="337" y2="556" stroke="#000" stroke-width="1.5"/>
  <line x1="337" y1="556" x2="590" y2="556" stroke="#000" stroke-width="1.5"/>
  <text x="345" y="570" class="rc" font-size="7.5px">BE 3P20A  BE 3P30A  BE 3P30A  BE 3P20A</text>
  <text x="365" y="582" class="rc" font-size="7px">a          b         c</text>
  <text x="358" y="596" class="rc" font-size="7px">空調機1   空調機2   冷蔵庫</text>
  <!-- E -->
  <line x1="337" y1="608" x2="337" y2="615" stroke="#000" stroke-width="1.5"/>
  <line x1="330" y1="615" x2="344" y2="615" stroke="#000" stroke-width="1.5"/>
  <line x1="332" y1="618" x2="342" y2="618" stroke="#000" stroke-width="1"/>
  <text x="348" y="616" class="rc" font-size="7px">D種接地</text>

  <!-- ===== LEGEND ===== -->
  <rect x="12" y="636" width="596" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="2"/>
  <text x="20" y="649" font-size="8px" font-weight="bold" fill="#333">凡例：</text>
  <circle cx="55" cy="647" r="7" fill="white" stroke="#000" stroke-width="1.2"/>
  <text x="55" y="647" font-size="7.5px" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="central">①</text>
  <text x="68" y="651" font-size="8px" fill="#444">=回路番号</text>
  <text x="130" y="651" font-size="8px" fill="#444">BE=漏電遮断器</text>
  <text x="218" y="651" font-size="8px" fill="#444">TS=タイムスイッチ</text>
  <text x="316" y="651" font-size="8px" fill="#444">RT=リモコントランス</text>
  <text x="430" y="651" font-size="8px" fill="#444">RC=リモコンセレクタスイッチ</text>
  <text x="20" y="666" font-size="7.5px" fill="#666">※公式図面のトレースではない学習用独自模式図。建物・回路レイアウトは独自設計。単線図は学習目的に合わせて再構成。</text>
</svg>
