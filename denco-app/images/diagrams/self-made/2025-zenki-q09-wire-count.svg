<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="100%" style="max-width:640px" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">配線図 ⑨ 最少電線本数</title>
  <desc id="desc">令和7年度上期配線図の⑨部分を拡大し、単純な2線式区間の最少心線数が2本であることを読み取りやすくした学習用図。</desc>
  <rect width="640" height="500" fill="#f8fafc"/>

  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/>
    </marker>
  </defs>

  <text x="28" y="36" font-size="18" font-weight="bold" fill="#111827">配線図 ⑨ 拡大図</text>
  <text x="28" y="60" font-size="12" fill="#4b5563">最少電線本数（心線数）を数えるための整理図</text>

  <!-- Main crop -->
  <rect x="36" y="88" width="392" height="328" rx="5" fill="white" stroke="#4b5563" stroke-width="1.6"/>
  <text x="232" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">1階 共用部の⑨区間</text>

  <!-- Junction / section diagram -->
  <rect x="94" y="156" width="88" height="58" rx="5" fill="#fffbea" stroke="#8a7a32" stroke-width="1.8"/>
  <text x="138" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b5a16">接続元</text>
  <rect x="282" y="156" width="88" height="58" rx="5" fill="#eef2ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="326" y="181" text-anchor="middle" font-size="13" fill="#2563eb">負荷側</text>
  <text x="326" y="200" text-anchor="middle" font-size="13" fill="#2563eb">機器</text>

  <line x1="182" y1="176" x2="282" y2="176" stroke="#cc0000" stroke-width="3"/>
  <line x1="182" y1="198" x2="282" y2="198" stroke="#4b5563" stroke-width="3"/>
  <text x="232" y="164" text-anchor="middle" font-size="12" fill="#cc0000">非接地側</text>
  <text x="232" y="220" text-anchor="middle" font-size="12" fill="#4b5563">接地側</text>

  <circle cx="232" cy="248" r="22" fill="#e8f0ff" stroke="#3355aa" stroke-width="2.2"/>
  <text x="232" y="256" text-anchor="middle" font-size="19" font-weight="bold" fill="#3355aa">⑨</text>
  <line x1="232" y1="226" x2="232" y2="202" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Count panel -->
  <rect x="74" y="300" width="316" height="82" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="94" y="326" font-size="13" font-weight="bold" fill="#111827">この区間で必要な心線</text>
  <circle cx="106" cy="352" r="6" fill="#cc0000"/>
  <text x="122" y="357" font-size="13" fill="#374151">電源側へ行く線 1本</text>
  <circle cx="270" cy="352" r="6" fill="#4b5563"/>
  <text x="286" y="357" font-size="13" fill="#374151">戻り線 1本</text>
  <text x="94" y="377" font-size="15" font-weight="bold" fill="#3355aa">合計：2本（2心）</text>

  <!-- Callout -->
  <path d="M454 122 H594 Q606 122 606 134 V284 Q606 296 594 296 H454 Q442 296 442 284 V134 Q442 122 454 122 Z" fill="#fffdf3" stroke="#d6a300" stroke-width="1.6"/>
  <text x="468" y="151" font-size="14" font-weight="bold" fill="#374151">読み取りポイント</text>
  <text x="468" y="180" font-size="13" fill="#374151">⑨は分岐や3路ではなく、</text>
  <text x="468" y="203" font-size="13" fill="#374151">単純な2線式区間。</text>
  <text x="468" y="232" font-size="13" fill="#374151">往きと戻りの2本で</text>
  <text x="468" y="255" font-size="13" font-weight="bold" fill="#3355aa">最少2心線</text>

  <!-- Mini locator -->
  <rect x="462" y="332" width="126" height="72" rx="4" fill="white" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="525" y="351" text-anchor="middle" font-size="10" fill="#6b7280">全体図での位置</text>
  <rect x="480" y="362" width="92" height="30" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.8"/>
  <line x1="526" y1="366" x2="526" y2="388" stroke="#4b5563" stroke-width="1.8"/>
  <circle cx="526" cy="366" r="8" fill="#e8f0ff" stroke="#3355aa" stroke-width="1.3"/>
  <text x="526" y="370" text-anchor="middle" font-size="8" font-weight="bold" fill="#3355aa">⑨</text>

  <!-- Legend -->
  <line x1="36" y1="456" x2="82" y2="456" stroke="#cc0000" stroke-width="3"/>
  <text x="94" y="460" font-size="11" fill="#4b5563">非接地側</text>
  <line x1="188" y1="456" x2="234" y2="456" stroke="#4b5563" stroke-width="3"/>
  <text x="246" y="460" font-size="11" fill="#4b5563">接地側・戻り線</text>
</svg>
