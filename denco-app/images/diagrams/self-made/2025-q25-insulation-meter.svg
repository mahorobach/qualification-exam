<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" role="img" aria-labelledby="title desc">
<title id="title">問25 アナログ式絶縁抵抗計の表示部（4択）</title>
<desc id="desc">アナログ式絶縁抵抗計（メガー）の表示部として正しいものを選ぶ問題の4択イラスト</desc>
<rect width="700" height="380" fill="#f8fafc"/>
<text x="350" y="24" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">アナログ式絶縁抵抗計の表示部として正しいものは。【正解：ハ】</text>

<!-- Helper: draw meter face as group -->
<!-- イ: Linear scale 0-20 (WRONG - should be right-zero) -->
<g transform="translate(30,50)">
  <text x="120" y="18" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#dc2626">イ（誤）</text>
  <rect x="10" y="28" width="220" height="160" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Scale arc -->
  <path d="M40 160 A100 100 0 0 1 200 160" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Tick marks - linear (wrong) -->
  <line x1="40" y1="160" x2="44" y2="148" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="80" x2="87" y2="91" stroke="#374151" stroke-width="2"/>
  <line x1="120" y1="60" x2="120" y2="74" stroke="#374151" stroke-width="2"/>
  <line x1="160" y1="80" x2="153" y2="91" stroke="#374151" stroke-width="2"/>
  <line x1="200" y1="160" x2="196" y2="148" stroke="#374151" stroke-width="2"/>
  <text x="26" y="178" font-family="Arial,sans-serif" font-size="12" fill="#374151">0</text>
  <text x="72" y="70" font-family="Arial,sans-serif" font-size="12" fill="#374151">5</text>
  <text x="112" y="52" font-family="Arial,sans-serif" font-size="12" fill="#374151">10</text>
  <text x="148" y="70" font-family="Arial,sans-serif" font-size="12" fill="#374151">15</text>
  <text x="188" y="178" font-family="Arial,sans-serif" font-size="12" fill="#374151">20</text>
  <text x="105" y="140" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#374151">MΩ</text>
  <!-- Needle -->
  <line x1="120" y1="155" x2="120" y2="72" stroke="#dc2626" stroke-width="2.5"/>
  <text x="120" y="186" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#dc2626">※ 目盛が均等→誤り</text>
</g>

<!-- ロ: scale starts from right (left=∞) but compressed wrong direction -->
<g transform="translate(370,50)">
  <text x="120" y="18" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#dc2626">ロ（誤）</text>
  <rect x="10" y="28" width="220" height="160" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M40 160 A100 100 0 0 1 200 160" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Wrong: ∞ on right, 0 on left -->
  <text x="26" y="178" font-family="Arial,sans-serif" font-size="11" fill="#374151">∞</text>
  <text x="108" y="52" font-family="Arial,sans-serif" font-size="11" fill="#374151">1MΩ</text>
  <text x="185" y="178" font-family="Arial,sans-serif" font-size="11" fill="#374151">0</text>
  <text x="105" y="140" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#374151">MΩ</text>
  <line x1="120" y1="155" x2="120" y2="72" stroke="#dc2626" stroke-width="2.5"/>
  <text x="120" y="186" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#dc2626">※ ∞方向が逆→誤り</text>
</g>

<!-- ハ: CORRECT - right side = 0, left = ∞, logarithmic (compressed at high values) -->
<g transform="translate(30,230)">
  <text x="120" y="18" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#059669">ハ（正解 ✓）</text>
  <rect x="10" y="28" width="220" height="160" rx="12" fill="#f0fdf4" stroke="#059669" stroke-width="3"/>
  <path d="M40 160 A100 100 0 0 1 200 160" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Correct: ∞ on left (compressed), 0 on right, log scale -->
  <text x="18" y="178" font-family="Arial,sans-serif" font-size="11" fill="#374151">∞</text>
  <text x="48" y="95" font-family="Arial,sans-serif" font-size="10" fill="#374151">50</text>
  <text x="72" y="68" font-family="Arial,sans-serif" font-size="10" fill="#374151">10</text>
  <text x="108" y="52" font-family="Arial,sans-serif" font-size="10" fill="#374151">2</text>
  <text x="148" y="65" font-family="Arial,sans-serif" font-size="10" fill="#374151">1</text>
  <text x="172" y="88" font-family="Arial,sans-serif" font-size="10" fill="#374151">0.5</text>
  <text x="186" y="178" font-family="Arial,sans-serif" font-size="11" fill="#374151">0</text>
  <text x="105" y="140" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#374151">MΩ</text>
  <!-- Tick marks (logarithmic spacing) -->
  <line x1="48" y1="160" x2="52" y2="148" stroke="#374151" stroke-width="1.5"/>
  <line x1="70" y1="100" x2="77" y2="110" stroke="#374151" stroke-width="1.5"/>
  <line x1="110" y1="62" x2="112" y2="74" stroke="#374151" stroke-width="1.5"/>
  <line x1="150" y1="78" x2="146" y2="88" stroke="#374151" stroke-width="1.5"/>
  <line x1="178" y1="118" x2="174" y2="128" stroke="#374151" stroke-width="1.5"/>
  <line x1="200" y1="160" x2="196" y2="148" stroke="#374151" stroke-width="1.5"/>
  <!-- Needle pointing at ~1MΩ -->
  <line x1="120" y1="155" x2="140" y2="72" stroke="#059669" stroke-width="2.5"/>
  <text x="120" y="186" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#059669">右ゼロ・対数目盛→正解</text>
</g>

<!-- ニ: Linear scale like voltmeter (wrong) -->
<g transform="translate(370,230)">
  <text x="120" y="18" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#dc2626">ニ（誤）</text>
  <rect x="10" y="28" width="220" height="160" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2.5"/>
  <path d="M40 160 A100 100 0 0 1 200 160" fill="none" stroke="#374151" stroke-width="2"/>
  <!-- Linear scale 0-300 (like voltmeter) wrong for megger -->
  <text x="26" y="178" font-family="Arial,sans-serif" font-size="11" fill="#374151">0</text>
  <text x="60" y="80" font-family="Arial,sans-serif" font-size="10" fill="#374151">50</text>
  <text x="104" y="52" font-family="Arial,sans-serif" font-size="10" fill="#374151">100</text>
  <text x="148" y="65" font-family="Arial,sans-serif" font-size="10" fill="#374151">200</text>
  <text x="180" y="178" font-family="Arial,sans-serif" font-size="10" fill="#374151">300</text>
  <text x="105" y="140" font-family="Arial,sans-serif" font-size="13" text-anchor="middle" fill="#374151">MΩ</text>
  <line x1="120" y1="155" x2="120" y2="72" stroke="#dc2626" stroke-width="2.5"/>
  <text x="120" y="186" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#dc2626">※ 線形でゼロが左→誤り</text>
</g>
</svg>
