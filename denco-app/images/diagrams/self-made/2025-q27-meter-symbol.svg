<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" role="img" aria-labelledby="title desc">
<title id="title">問27 直動式指示電気計器の記号（永久磁石可動コイル形・水平置き直流）</title>
<desc id="desc">目盛板にある2つの記号の意味を問う問題。永久磁石可動コイル形、水平置き使用、直流回路用。</desc>
<rect width="500" height="200" fill="#f8fafc"/>

<text x="250" y="26" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#111827">目盛板の記号の意味と使用回路</text>

<!-- Left symbol: circle with horseshoe (永久磁石可動コイル形) -->
<g transform="translate(80, 60)">
  <!-- Outer circle (instrument type symbol) -->
  <circle cx="60" cy="60" r="50" fill="#fff" stroke="#374151" stroke-width="3"/>
  <!-- Horseshoe magnet shape inside = 永久磁石可動コイル形 -->
  <path d="M35 40 Q35 20 60 20 Q85 20 85 40 L85 55 Q85 70 75 75 L45 75 Q35 70 35 55 Z"
        fill="none" stroke="#374151" stroke-width="3"/>
  <!-- Coil rectangle in center -->
  <rect x="48" y="44" width="24" height="20" rx="2" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Arrows indicating coil movement -->
  <line x1="54" y1="72" x2="54" y2="80" stroke="#374151" stroke-width="1.5"/>
  <line x1="66" y1="72" x2="66" y2="80" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="100" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#374151">可動コイル</text>
  <text x="60" y="114" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#374151">永久磁石形</text>
</g>

<!-- Right symbol: horizontal line (水平置き使用) -->
<g transform="translate(280, 60)">
  <circle cx="60" cy="60" r="50" fill="#fff" stroke="#374151" stroke-width="3"/>
  <!-- Horizontal line symbol = 水平置き (horizontal position) -->
  <line x1="30" y1="60" x2="90" y2="60" stroke="#374151" stroke-width="4"/>
  <text x="60" y="100" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#374151">水平置き</text>
  <text x="60" y="114" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#374151">（目盛板水平）</text>
</g>

</svg>
