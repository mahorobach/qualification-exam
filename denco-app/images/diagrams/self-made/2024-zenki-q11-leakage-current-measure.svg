<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="title desc">
  <title id="title">2024年前期 問題11 ⑭漏れ電流測定</title>
  <desc id="desc">2024年度前期配線図の⑭に示す回路の漏れ電流測定場面を読み取りやすくした学習用自作図。測定器名は図中に表示しない。</desc>
  <style>
    text { font-family: Arial, "Hiragino Sans", "Yu Gothic", sans-serif; }
    .floor { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }
    .office { fill: #f1f5ff; stroke: #64748b; stroke-width: 1.5; }
    .wash { fill: #eef6ff; stroke: #64748b; stroke-width: 1.5; }
    .cooler { fill: #eefbf1; stroke: #64748b; stroke-width: 1.5; }
    .wire { fill: none; stroke: #111827; stroke-width: 4; stroke-linecap: round; }
    .wire2 { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; }
    .jaw { fill: none; stroke: #2563eb; stroke-width: 7; stroke-linecap: round; }
    .meter { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; }
    .mark { fill: #fff; stroke: #2563eb; stroke-width: 3; }
    .num { font-size: 18px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; dominant-baseline: central; }
    .label { font-size: 15px; fill: #334155; }
    .small { font-size: 12px; fill: #475569; }
    .room-name { font-size: 17px; font-weight: 700; fill: #334155; text-anchor: middle; }
  </style>

  <rect width="760" height="500" fill="#ffffff"/>

  <rect x="28" y="22" width="704" height="58" rx="10" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="380" y="47" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">2024年度前期 配線図（学習用模式図）</text>
  <text x="380" y="69" text-anchor="middle" font-size="13" fill="#475569">⑭で示す回路の漏れ電流測定を確認するための整理図</text>

  <!-- Simplified area near the target -->
  <rect x="78" y="112" width="468" height="170" class="floor" rx="4"/>
  <rect x="92" y="126" width="186" height="136" class="office"/>
  <text x="185" y="184" class="room-name">事務所</text>
  <rect x="278" y="126" width="108" height="76" class="wash"/>
  <text x="332" y="170" class="room-name" font-size="15">手洗い</text>
  <rect x="386" y="126" width="146" height="136" class="cooler"/>
  <text x="459" y="184" class="room-name" font-size="15">冷蔵庫コーナー</text>

  <!-- Circuit and target point -->
  <path d="M220 180 H316 H396" class="wire"/>
  <path d="M220 198 H316 H396" class="wire2"/>
  <circle cx="316" cy="180" r="5" fill="#fff" stroke="#111827" stroke-width="2"/>
  <circle cx="316" cy="198" r="5" fill="#fff" stroke="#111827" stroke-width="2"/>
  <circle cx="294" cy="189" r="18" class="mark"/>
  <text x="294" y="189" class="num">⑭</text>

  <!-- Enlarged measurement scene -->
  <rect x="128" y="316" width="504" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">⑭ 回路を囲んで測定する場面</text>
  <path d="M220 384 H540" class="wire"/>
  <path d="M220 404 H540" class="wire2"/>
  <path d="M334 392 C334 354 426 354 426 392" class="jaw"/>
  <path d="M340 392 C340 424 420 424 420 392" class="jaw"/>
  <rect x="350" y="384" width="60" height="34" rx="8" class="meter"/>
  <text x="380" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">mA</text>

  <rect x="84" y="444" width="592" height="38" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g transform="translate(116 463)">
    <circle cx="0" cy="0" r="13" class="mark"/>
    <text x="0" y="0" class="num" font-size="14">⑭</text>
    <text x="30" y="5" class="label" font-weight="700">対象位置</text>
    <text x="126" y="5" class="small">漏れ電流を、回路を開かずに測定する器具を選ぶ。</text>
  </g>
</svg>
