<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-labelledby="title desc">
<title id="title">単相3線式回路の電圧計算（問7）</title>
<desc id="desc">単相3線式103/103V・各線0.1Ω・上負荷20A・下負荷10AのときのA-B間電圧を求める回路図（令和7年度上期 問7）</desc>
<rect width="700" height="340" fill="#f8fafc"/>

<!-- Source -->
<text x="30" y="26" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" font-weight="bold" fill="#111827">1φ3W 電源</text>

<!-- Top source 103V -->
<circle cx="80" cy="90" r="24" fill="none" stroke="#1f2937" stroke-width="2.5"/>
<text x="72" y="95" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#1f2937">〜</text>
<text x="26" y="58" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#111827">103V</text>

<!-- Bottom source 103V -->
<circle cx="80" cy="240" r="24" fill="none" stroke="#1f2937" stroke-width="2.5"/>
<text x="72" y="245" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#1f2937">〜</text>
<text x="26" y="265" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#111827">103V</text>

<!-- 206V label between sources -->
<text x="8" y="172" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#6b7280">206V</text>

<!-- Top wire with 0.1Ω -->
<line x1="104" y1="78" x2="220" y2="78" stroke="#1f2937" stroke-width="3"/>
<rect x="220" y="64" width="70" height="28" rx="4" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="255" y="83" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" text-anchor="middle" fill="#111827">0.1Ω</text>
<line x1="290" y1="78" x2="430" y2="78" stroke="#1f2937" stroke-width="3"/>

<!-- Middle wire (neutral) with 0.1Ω -->
<line x1="104" y1="165" x2="220" y2="165" stroke="#1f2937" stroke-width="3"/>
<rect x="220" y="151" width="70" height="28" rx="4" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="255" y="170" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" text-anchor="middle" fill="#111827">0.1Ω</text>
<line x1="290" y1="165" x2="430" y2="165" stroke="#1f2937" stroke-width="3"/>
<text x="140" y="157" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="13" fill="#6b7280">中性線</text>

<!-- Bottom wire with 0.1Ω -->
<line x1="104" y1="252" x2="220" y2="252" stroke="#1f2937" stroke-width="3"/>
<rect x="220" y="238" width="70" height="28" rx="4" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="255" y="257" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" text-anchor="middle" fill="#111827">0.1Ω</text>
<line x1="290" y1="252" x2="430" y2="252" stroke="#1f2937" stroke-width="3"/>

<!-- Top source connection -->
<line x1="80" y1="66" x2="80" y2="78" stroke="#1f2937" stroke-width="2.5"/>
<line x1="80" y1="114" x2="80" y2="165" stroke="#1f2937" stroke-width="2.5"/>
<!-- Bottom source connection -->
<line x1="80" y1="165" x2="80" y2="216" stroke="#1f2937" stroke-width="2.5"/>
<line x1="80" y1="264" x2="80" y2="252" stroke="#1f2937" stroke-width="2.5"/>

<!-- Terminal a (top-right of top load) -->
<circle cx="430" cy="78" r="6" fill="#ef4444"/>
<text x="438" y="83" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" font-weight="bold" fill="#ef4444">a</text>

<!-- Terminal b (middle-right, neutral) -->
<circle cx="430" cy="165" r="6" fill="#ef4444"/>
<text x="438" y="170" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" font-weight="bold" fill="#ef4444">b</text>

<!-- Top load: 20A -->
<rect x="430" y="64" width="120" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
<text x="490" y="88" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" text-anchor="middle" fill="#2563eb">抵抗負荷</text>
<text x="490" y="106" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" text-anchor="middle" fill="#2563eb">20 A</text>
<line x1="550" y1="78" x2="580" y2="78" stroke="#1f2937" stroke-width="2.5"/>
<line x1="550" y1="114" x2="580" y2="165" stroke="#1f2937" stroke-width="2.5"/>

<!-- Bottom load: 10A -->
<rect x="430" y="165" width="120" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
<text x="490" y="188" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" text-anchor="middle" fill="#2563eb">抵抗負荷</text>
<text x="490" y="206" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" text-anchor="middle" fill="#2563eb">10 A</text>
<line x1="550" y1="165" x2="580" y2="165" stroke="#1f2937" stroke-width="2.5"/>
<line x1="550" y1="215" x2="580" y2="252" stroke="#1f2937" stroke-width="2.5"/>

<!-- Right rail -->
<line x1="580" y1="78" x2="580" y2="252" stroke="#1f2937" stroke-width="2.5"/>

<!-- Question mark -->
<text x="490" y="148" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" text-anchor="middle" fill="#6b7280">a-b間電圧 [V] = ?</text>

<!-- Bottom terminal connection -->
<circle cx="430" cy="252" r="6" fill="#6b7280"/>

<!-- Note -->
<text x="40" y="318" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="13" fill="#6b7280">中性線電流=20−10=10A（負荷→電源方向） Va=103−0.1×20=101V　Vb=0+0.1×10=1V</text>
<text x="40" y="335" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="13" fill="#6b7280">→ a-b間電圧 = Va − Vb = 101 − 1 = 100 V（答：ロ）</text>
</svg>
