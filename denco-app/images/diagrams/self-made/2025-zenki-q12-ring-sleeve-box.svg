<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" style="max-width:640px" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">配線図 ⑫ リングスリーブ接続</title>
  <desc id="desc">令和7年度上期配線図の⑫ボックス内接続で、リングスリーブの種類、個数、刻印を数えやすくした学習用拡大図。</desc>
  <rect width="640" height="520" fill="#f8fafc"/>
  <defs><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker></defs>
  <text x="28" y="36" font-size="18" font-weight="bold" fill="#111827">配線図 ⑫ 拡大図</text>
  <text x="28" y="60" font-size="12" fill="#4b5563">VVF1.6 の接続本数を数え、選択肢と照合するための整理図</text>
  <rect x="36" y="88" width="392" height="338" rx="5" fill="white" stroke="#4b5563" stroke-width="1.6"/>
  <text x="232" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">地下1階 ジョイントボックス ⑫</text>
  <rect x="246" y="166" width="116" height="88" rx="8" fill="#fffbea" stroke="#8a7a32" stroke-width="2"/>
  <text x="304" y="216" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b5a16">JB</text>
  <circle cx="216" cy="166" r="22" fill="#e8f0ff" stroke="#3355aa" stroke-width="2.2"/>
  <text x="216" y="174" text-anchor="middle" font-size="19" font-weight="bold" fill="#3355aa">⑫</text>
  <line x1="84" y1="168" x2="246" y2="188" stroke="#cc0000" stroke-width="2.4"/>
  <line x1="84" y1="198" x2="246" y2="208" stroke="#4b5563" stroke-width="2.4"/>
  <text x="88" y="154" font-size="12" fill="#4b5563">地下1階側</text>
  <line x1="362" y1="188" x2="520" y2="150" stroke="#cc0000" stroke-width="2.4"/>
  <line x1="362" y1="208" x2="520" y2="190" stroke="#4b5563" stroke-width="2.4"/>
  <text x="458" y="138" font-size="12" fill="#4b5563">1階側</text>
  <line x1="290" y1="254" x2="230" y2="334" stroke="#cc0000" stroke-width="2.4"/>
  <line x1="316" y1="254" x2="378" y2="334" stroke="#4b5563" stroke-width="2.4"/>
  <text x="250" y="356" font-size="12" fill="#4b5563">分岐先</text>
  <rect x="78" y="292" width="320" height="102" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="98" y="318" font-size="13" font-weight="bold" fill="#111827">ボックス内の接続条件</text>
  <text x="98" y="344" font-size="13" fill="#374151">同じ本数の接続点が4か所</text>
  <text x="98" y="368" font-size="13" fill="#374151">各接続点の電線本数を選択肢と照合</text>
  <text x="98" y="388" font-size="12" fill="#6b7280">スリーブ名と刻印は選択肢で確認。</text>
  <path d="M454 116 H594 Q606 116 606 128 V292 Q606 304 594 304 H454 Q442 304 442 292 V128 Q442 116 454 116 Z" fill="#fffdf3" stroke="#d6a300" stroke-width="1.6"/>
  <text x="468" y="145" font-size="14" font-weight="bold" fill="#374151">読み取りポイント</text>
  <text x="468" y="174" font-size="13" fill="#374151">使用電線はすべて</text>
  <text x="468" y="197" font-size="13" fill="#374151">VVF1.6。</text>
  <text x="468" y="220" font-size="13" fill="#374151">接続点ごとの本数を</text>
  <text x="468" y="243" font-size="13" fill="#374151">数えて、写真の刻印と</text>
  <text x="468" y="266" font-size="13" fill="#374151">選択肢を照合。</text>
  <line x1="442" y1="232" x2="362" y2="214" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="480" y="342" width="76" height="74" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.5"/>
  <ellipse cx="518" cy="380" rx="18" ry="28" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="518" y="386" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">刻印</text>
  <text x="518" y="438" text-anchor="middle" font-size="11" fill="#4b5563">写真と照合</text>
  <line x1="36" y1="466" x2="82" y2="466" stroke="#cc0000" stroke-width="2.4"/>
  <text x="94" y="470" font-size="11" fill="#4b5563">黒線</text>
  <line x1="178" y1="466" x2="224" y2="466" stroke="#4b5563" stroke-width="2.4"/>
  <text x="236" y="470" font-size="11" fill="#4b5563">白線</text>
  <rect x="332" y="452" width="30" height="24" rx="3" fill="#fffbea" stroke="#8a7a32" stroke-width="1.2"/>
  <text x="374" y="470" font-size="11" fill="#4b5563">ジョイントボックス</text>
</svg>
