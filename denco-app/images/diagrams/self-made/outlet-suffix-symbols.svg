<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Self-made outlet suffix symbols</title>
  <desc id="desc">Original simplified outlet symbol cards for learning E, ET, EET, WP, and T suffixes. This is not copied from official exam figures.</desc>
  <rect width="920" height="420" fill="#fff"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif">
    <text x="50" y="50" font-size="24" font-weight="700" fill="#111827">コンセント傍記の自作整理図</text>
    <g transform="translate(60 90)">
      <rect width="150" height="180" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
      <circle cx="56" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="94" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <text x="75" y="135" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">E</text>
      <text x="75" y="162" text-anchor="middle" font-size="14" fill="#374151">接地極付き</text>
    </g>
    <g transform="translate(230 90)">
      <rect width="150" height="180" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
      <circle cx="52" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="98" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <line x1="75" y1="92" x2="75" y2="116" stroke="#111827" stroke-width="4"/>
      <text x="75" y="142" text-anchor="middle" font-size="32" font-weight="700" fill="#111827">ET</text>
      <text x="75" y="166" text-anchor="middle" font-size="14" fill="#374151">接地端子付き</text>
    </g>
    <g transform="translate(400 90)">
      <rect width="150" height="180" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
      <circle cx="52" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="98" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <line x1="75" y1="92" x2="75" y2="116" stroke="#111827" stroke-width="4"/>
      <text x="75" y="142" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">EET</text>
      <text x="75" y="166" text-anchor="middle" font-size="13" fill="#374151">接地極+端子</text>
    </g>
    <g transform="translate(570 90)">
      <rect width="150" height="180" rx="12" fill="#eff6ff" stroke="#111827" stroke-width="3"/>
      <circle cx="52" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="98" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <path d="M42 42h66l18 26v76H24V68z" fill="none" stroke="#2563eb" stroke-width="3"/>
      <text x="75" y="142" text-anchor="middle" font-size="32" font-weight="700" fill="#111827">WP</text>
      <text x="75" y="166" text-anchor="middle" font-size="14" fill="#374151">防雨形</text>
    </g>
    <g transform="translate(740 90)">
      <rect width="150" height="180" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
      <circle cx="52" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="98" cy="76" r="12" fill="none" stroke="#111827" stroke-width="3"/>
      <path d="M52 76l18 -20M98 76l-18 20" stroke="#111827" stroke-width="4"/>
      <text x="75" y="142" text-anchor="middle" font-size="34" font-weight="700" fill="#111827">T</text>
      <text x="75" y="166" text-anchor="middle" font-size="14" fill="#374151">抜け止め形</text>
    </g>
    <text x="50" y="350" font-size="15" fill="#111827">注: 傍記の意味を整理するための独自アイコン。公式写真・公式図面は使用していません。</text>
  </g>
</svg>
