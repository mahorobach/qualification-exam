<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" width="100%" style="max-width:700px" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
  <title id="title">単相3線式回路のa-b間電圧</title>
  <desc id="desc">単相3線式103/103V・各線0.1Ω・上負荷20A・下負荷10Aのとき、a-b間電圧を求めるための整理図。</desc>
  <rect width="700" height="430" fill="#f8fafc"/>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c2410c"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="28" y="30" font-size="17" font-weight="bold" fill="#111827">単相3線式回路</text>
  <text x="28" y="52" font-size="12" fill="#4b5563">1φ3W 206V（各相103V）、各線抵抗0.1Ω</text>

  <!-- Source -->
  <circle cx="86" cy="120" r="25" fill="white" stroke="#1f2937" stroke-width="2.5"/>
  <text x="78" y="126" font-size="16" fill="#1f2937">〜</text>
  <circle cx="86" cy="270" r="25" fill="white" stroke="#1f2937" stroke-width="2.5"/>
  <text x="78" y="276" font-size="16" fill="#1f2937">〜</text>
  <line x1="86" y1="95" x2="86" y2="100" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="86" y1="145" x2="86" y2="195" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="86" y1="195" x2="86" y2="245" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="86" y1="295" x2="86" y2="300" stroke="#1f2937" stroke-width="2.5"/>
  <text x="32" y="107" font-size="13" fill="#111827">103V</text>
  <text x="32" y="286" font-size="13" fill="#111827">103V</text>
  <text x="18" y="201" font-size="13" fill="#6b7280">206V</text>

  <!-- Conductors -->
  <line x1="112" y1="120" x2="238" y2="120" stroke="#1f2937" stroke-width="3"/>
  <line x1="324" y1="120" x2="458" y2="120" stroke="#1f2937" stroke-width="3"/>
  <rect x="238" y="104" width="86" height="32" rx="5" fill="white" stroke="#1f2937" stroke-width="2"/>
  <text x="281" y="125" text-anchor="middle" font-size="16" fill="#111827">0.1Ω</text>

  <line x1="112" y1="195" x2="238" y2="195" stroke="#1f2937" stroke-width="3"/>
  <line x1="324" y1="195" x2="458" y2="195" stroke="#1f2937" stroke-width="3"/>
  <rect x="238" y="179" width="86" height="32" rx="5" fill="white" stroke="#1f2937" stroke-width="2"/>
  <text x="281" y="200" text-anchor="middle" font-size="16" fill="#111827">0.1Ω</text>
  <text x="134" y="184" font-size="12" fill="#6b7280">中性線</text>

  <line x1="112" y1="270" x2="238" y2="270" stroke="#1f2937" stroke-width="3"/>
  <line x1="324" y1="270" x2="458" y2="270" stroke="#1f2937" stroke-width="3"/>
  <rect x="238" y="254" width="86" height="32" rx="5" fill="white" stroke="#1f2937" stroke-width="2"/>
  <text x="281" y="275" text-anchor="middle" font-size="16" fill="#111827">0.1Ω</text>

  <!-- Terminals -->
  <circle cx="458" cy="120" r="6" fill="#ef4444"/>
  <text x="442" y="111" font-size="19" font-weight="bold" fill="#ef4444">a</text>
  <circle cx="458" cy="195" r="6" fill="#ef4444"/>
  <text x="442" y="216" font-size="19" font-weight="bold" fill="#ef4444">b</text>
  <circle cx="458" cy="270" r="6" fill="#6b7280"/>

  <!-- Loads -->
  <rect x="458" y="98" width="126" height="56" rx="7" fill="white" stroke="#2563eb" stroke-width="2.5"/>
  <text x="521" y="121" text-anchor="middle" font-size="14" fill="#2563eb">抵抗負荷</text>
  <text x="521" y="141" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">20 A</text>
  <line x1="584" y1="120" x2="618" y2="120" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="584" y1="154" x2="618" y2="195" stroke="#1f2937" stroke-width="2.5"/>

  <rect x="458" y="195" width="126" height="56" rx="7" fill="white" stroke="#2563eb" stroke-width="2.5"/>
  <text x="521" y="218" text-anchor="middle" font-size="14" fill="#2563eb">抵抗負荷</text>
  <text x="521" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">10 A</text>
  <line x1="584" y1="195" x2="618" y2="195" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="584" y1="251" x2="618" y2="270" stroke="#1f2937" stroke-width="2.5"/>
  <line x1="618" y1="120" x2="618" y2="270" stroke="#1f2937" stroke-width="2.5"/>

  <!-- Current notes -->
  <path d="M170 87 H390" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="212" y="80" font-size="12" fill="#2563eb">上線電流 20A</text>
  <path d="M390 224 H176" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="194" y="242" font-size="12" fill="#c2410c">中性線電流 20-10=10A</text>

  <!-- Formula panel -->
  <rect x="34" y="318" width="632" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="52" y="342" font-size="13" font-weight="bold" fill="#111827">計算の見る場所</text>
  <text x="52" y="365" font-size="13" fill="#374151">a点：上線の電圧降下を引く</text>
  <text x="252" y="365" font-size="13" font-weight="bold" fill="#2563eb">Va = 103 - 0.1 × 20</text>
  <text x="52" y="386" font-size="13" fill="#374151">b点：中性線の電圧上昇を足す</text>
  <text x="252" y="386" font-size="13" font-weight="bold" fill="#c2410c">Vb = 0 + 0.1 × 10</text>
  <text x="456" y="376" font-size="15" font-weight="bold" fill="#111827">a-b = Va - Vb</text>

  <!-- Legend -->
  <line x1="36" y1="416" x2="80" y2="416" stroke="#1f2937" stroke-width="3"/>
  <text x="92" y="420" font-size="11" fill="#4b5563">電線</text>
  <circle cx="174" cy="416" r="5" fill="#ef4444"/>
  <text x="188" y="420" font-size="11" fill="#4b5563">測定端子 a・b</text>
  <rect x="304" y="402" width="50" height="26" rx="5" fill="white" stroke="#2563eb" stroke-width="1.6"/>
  <text x="368" y="420" font-size="11" fill="#4b5563">抵抗負荷</text>
</svg>
