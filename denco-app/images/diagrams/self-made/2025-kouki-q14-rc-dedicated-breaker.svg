<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" style="max-width:640px" font-family="sans-serif">
  <desc>2025年度下期 問題14用。配線図中の⑭、分電盤内のルームエアコン専用ブレーカーを読み取りやすくした学習用拡大図。</desc>
  <rect width="640" height="520" fill="#f9f9f6"/>

  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="28" y="36" font-size="18" font-weight="bold" fill="#1f2937">配線図 ⑭ 拡大図</text>
  <text x="28" y="60" font-size="12" fill="#4b5563">分電盤内のルームエアコン専用ブレーカーを確認する図</text>

  <!-- Distribution board crop -->
  <rect x="36" y="92" width="398" height="344" rx="4" fill="white" stroke="#555" stroke-width="1.5"/>
  <text x="235" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">電灯分電盤結線図</text>
  <text x="74" y="146" font-size="12" fill="#4b5563">1φ3W 100/200V</text>

  <!-- Main leakage breaker and branch breakers -->
  <rect x="72" y="168" width="66" height="52" rx="4" fill="#e5e7eb" stroke="#555" stroke-width="1.6"/>
  <text x="105" y="190" text-anchor="middle" font-size="10" fill="#374151">漏電</text>
  <text x="105" y="207" text-anchor="middle" font-size="10" fill="#374151">3P50A</text>

  <g fill="#f3f4f6" stroke="#777" stroke-width="1.3">
    <rect x="160" y="174" width="26" height="40" rx="3"/>
    <rect x="196" y="174" width="26" height="40" rx="3"/>
    <rect x="232" y="174" width="26" height="40" rx="3"/>
    <rect x="268" y="174" width="26" height="40" rx="3"/>
  </g>
  <text x="173" y="199" text-anchor="middle" font-size="11" fill="#6b7280">k</text>
  <text x="209" y="199" text-anchor="middle" font-size="11" fill="#6b7280">l</text>
  <text x="245" y="199" text-anchor="middle" font-size="11" fill="#6b7280">m</text>
  <text x="281" y="199" text-anchor="middle" font-size="11" fill="#6b7280">…</text>

  <!-- Target breaker symbol -->
  <g filter="url(#soft-shadow)">
    <rect x="320" y="160" width="58" height="72" rx="5" fill="#e8f0ff" stroke="#3355aa" stroke-width="2.2"/>
    <text x="349" y="188" text-anchor="middle" font-size="15" font-weight="bold" fill="#3355aa">2P</text>
    <text x="349" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#3355aa">20A</text>
  </g>
  <circle cx="412" cy="196" r="20" fill="#e8f0ff" stroke="#3355aa" stroke-width="2.2"/>
  <text x="412" y="203" text-anchor="middle" font-size="18" font-weight="bold" fill="#3355aa">⑭</text>
  <text x="320" y="260" font-size="15" font-weight="bold" fill="#3355aa">RC専用(n)</text>
  <text x="320" y="282" font-size="12" fill="#4b5563">単相200V・20A専用</text>

  <line x1="349" y1="232" x2="349" y2="300" stroke="#0000cc" stroke-width="2" stroke-dasharray="8,5"/>
  <rect x="274" y="300" width="122" height="62" rx="4" fill="#e8f8ff" stroke="#4488aa" stroke-width="1.5"/>
  <rect x="308" y="318" width="58" height="28" rx="3" fill="white" stroke="#0000cc" stroke-width="1.6"/>
  <text x="337" y="337" text-anchor="middle" font-size="13" fill="#0000cc">RC</text>
  <text x="300" y="382" font-size="12" font-weight="bold" fill="#0000cc">200V 20A</text>

  <!-- Photo-choice hint -->
  <path d="M458 126 H594 Q606 126 606 138 V288 Q606 300 594 300 H458 Q446 300 446 288 V138 Q446 126 458 126 Z" fill="#fffdf3" stroke="#d6a300" stroke-width="1.6"/>
  <text x="472" y="154" font-size="14" font-weight="bold" fill="#374151">写真で見るポイント</text>
  <text x="472" y="182" font-size="13" fill="#374151">⑭はRC専用の</text>
  <text x="472" y="205" font-size="13" fill="#374151">2P 20Aブレーカー。</text>
  <text x="472" y="228" font-size="13" fill="#374151">漏電遮断器は</text>
  <text x="472" y="251" font-size="13" fill="#374151">テストボタン付きで</text>
  <text x="472" y="274" font-size="13" fill="#374151">見分ける。</text>
  <line x1="446" y1="212" x2="379" y2="196" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Simplified breaker photo icon -->
  <rect x="484" y="330" width="84" height="100" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="500" y="348" width="52" height="48" rx="6" fill="#eef2ff" stroke="#3355aa" stroke-width="1.5"/>
  <circle cx="526" cy="414" r="8" fill="#fef3c7" stroke="#d6a300" stroke-width="1.4"/>
  <text x="526" y="418" text-anchor="middle" font-size="9" font-weight="bold" fill="#7c5a00">T</text>
  <text x="526" y="446" text-anchor="middle" font-size="10" fill="#6b7280">テストボタン</text>

  <!-- Legend -->
  <line x1="36" y1="466" x2="82" y2="466" stroke="#0000cc" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="92" y="470" font-size="11" fill="#4b5563">単相200V回路</text>
  <rect x="218" y="450" width="30" height="34" rx="3" fill="#e8f0ff" stroke="#3355aa" stroke-width="1.5"/>
  <text x="233" y="464" text-anchor="middle" font-size="8" font-weight="bold" fill="#3355aa">2P</text>
  <text x="233" y="477" text-anchor="middle" font-size="8" font-weight="bold" fill="#3355aa">20A</text>
  <text x="262" y="470" font-size="11" fill="#4b5563">問題のブレーカー記号</text>
</svg>
