<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" style="max-width:640px" font-family="sans-serif">
  <desc>2025年度下期 問題8用。配線図中の⑧、洋室BのW表示付きスイッチを読み取りやすくした学習用拡大図。</desc>
  <rect width="640" height="520" fill="#f9f9f6"/>

  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="28" y="36" font-size="18" font-weight="bold" fill="#1f2937">配線図 ⑧ 拡大図</text>
  <text x="28" y="60" font-size="12" fill="#4b5563">洋室Bに設置された、ハンドルが大型のスイッチ記号を確認する図</text>

  <!-- Main room crop -->
  <rect x="36" y="92" width="398" height="344" rx="4" fill="white" stroke="#555" stroke-width="1.5"/>
  <text x="235" y="122" text-anchor="middle" font-size="14" fill="#555">2階 洋室B</text>

  <rect x="36" y="92" width="398" height="36" fill="#f3f4f6" stroke="#555" stroke-width="1.5"/>
  <line x1="36" y1="128" x2="434" y2="128" stroke="#555" stroke-width="1"/>
  <text x="56" y="116" font-size="10" fill="#6b7280">上部：100V幹線</text>

  <!-- Wiring and lighting -->
  <line x1="210" y1="92" x2="210" y2="190" stroke="#cc0000" stroke-width="2"/>
  <circle cx="210" cy="206" r="18" fill="#fff7c7" stroke="#aa8800" stroke-width="1.6"/>
  <line x1="198" y1="194" x2="222" y2="218" stroke="#aa8800" stroke-width="1.4"/>
  <line x1="222" y1="194" x2="198" y2="218" stroke="#aa8800" stroke-width="1.4"/>
  <text x="210" y="240" text-anchor="middle" font-size="11" fill="#6b7280">照明</text>

  <line x1="210" y1="224" x2="292" y2="316" stroke="#cc0000" stroke-width="2"/>

  <!-- Target wide-handle switch symbol -->
  <g filter="url(#soft-shadow)">
    <line x1="292" y1="316" x2="360" y2="316" stroke="#555" stroke-width="3" stroke-linecap="round"/>
    <line x1="308" y1="316" x2="332" y2="286" stroke="#555" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="280" y="294" width="92" height="70" rx="5" fill="none" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,4"/>
  </g>
  <text x="326" y="392" text-anchor="middle" font-size="28" font-weight="bold" fill="#374151">W</text>
  <text x="326" y="416" text-anchor="middle" font-size="11" fill="#6b7280">W = ワイドハンドル形</text>

  <circle cx="386" cy="316" r="18" fill="#e8f0ff" stroke="#3355aa" stroke-width="2"/>
  <text x="386" y="322" text-anchor="middle" font-size="18" font-weight="bold" fill="#3355aa">⑧</text>

  <!-- Simple plate illustration for concept -->
  <rect x="92" y="278" width="86" height="118" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="108" y="304" width="54" height="66" rx="6" fill="#eef2ff" stroke="#3355aa" stroke-width="1.5"/>
  <text x="135" y="419" text-anchor="middle" font-size="11" fill="#6b7280">大型ハンドル</text>

  <!-- Callout -->
  <path d="M458 158 H594 Q606 158 606 170 V300 Q606 312 594 312 H458 Q446 312 446 300 V170 Q446 158 458 158 Z" fill="#fffdf3" stroke="#d6a300" stroke-width="1.6"/>
  <text x="472" y="186" font-size="14" font-weight="bold" fill="#374151">読み取りポイント</text>
  <text x="472" y="214" font-size="13" fill="#374151">⑧が指しているのは</text>
  <text x="472" y="237" font-size="13" fill="#374151">スイッチ記号。</text>
  <text x="472" y="260" font-size="13" fill="#374151">下の「W」は</text>
  <text x="472" y="283" font-size="13" fill="#374151">ワイドハンドル形を示す。</text>
  <line x1="446" y1="246" x2="361" y2="316" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Mini full-plan locator -->
  <rect x="462" y="340" width="132" height="86" rx="3" fill="white" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="528" y="358" text-anchor="middle" font-size="10" fill="#6b7280">全体図での位置</text>
  <rect x="476" y="370" width="38" height="38" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.8"/>
  <rect x="518" y="370" width="38" height="38" fill="#ffffff" stroke="#9ca3af" stroke-width="1.1"/>
  <rect x="560" y="370" width="24" height="38" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.8"/>
  <circle cx="548" cy="396" r="8" fill="#e8f0ff" stroke="#3355aa" stroke-width="1.4"/>
  <text x="548" y="400" text-anchor="middle" font-size="8" font-weight="bold" fill="#3355aa">⑧</text>
  <text x="537" y="420" text-anchor="middle" font-size="9" fill="#6b7280">2階 洋室B</text>

  <!-- Legend -->
  <line x1="36" y1="466" x2="82" y2="466" stroke="#cc0000" stroke-width="2"/>
  <text x="92" y="470" font-size="11" fill="#4b5563">単相100V回路</text>
  <circle cx="212" cy="466" r="9" fill="#fff7c7" stroke="#aa8800" stroke-width="1.2"/>
  <line x1="206" y1="460" x2="218" y2="472" stroke="#aa8800" stroke-width="1"/>
  <line x1="218" y1="460" x2="206" y2="472" stroke="#aa8800" stroke-width="1"/>
  <text x="230" y="470" font-size="11" fill="#4b5563">照明器具</text>
  <line x1="326" y1="466" x2="370" y2="466" stroke="#555" stroke-width="2"/>
  <line x1="338" y1="466" x2="354" y2="448" stroke="#555" stroke-width="1.8"/>
  <text x="388" y="470" font-size="11" fill="#4b5563">問題のスイッチ記号</text>
</svg>
