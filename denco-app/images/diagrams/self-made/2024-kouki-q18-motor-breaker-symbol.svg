<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="title desc">
  <title id="title">2024年後期 問題18 ⑩モータブレーカ</title>
  <desc id="desc">2024年度後期配線図の⑩に示すモータブレーカ位置と図記号を読み取りやすくした学習用自作図。</desc>
  <style>text{font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif}.area{fill:#f8fafc;stroke:#64748b;stroke-width:1.8}.symbol{fill:#fff;stroke:#111827;stroke-width:2.4}.mark{fill:#fff;stroke:#2563eb;stroke-width:3}.num{font-size:18px;font-weight:700;fill:#1d4ed8;text-anchor:middle;dominant-baseline:central}.small{font-size:12px;fill:#475569}.label{font-size:15px;fill:#334155}.title{font-size:20px;font-weight:700;fill:#0f172a;text-anchor:middle}</style>
  <rect width="760" height="460" fill="#fff"/>
  <rect x="28" y="22" width="704" height="58" rx="10" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="380" y="47" class="title">2024年度後期 配線図（学習用模式図）</text>
  <text x="380" y="69" text-anchor="middle" class="small">⑩に取り付けるモータブレーカの図記号を確認するための整理図</text>
  <rect x="96" y="116" width="430" height="220" rx="4" class="area"/>
  <text x="312" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">1階工場</text>
  <circle cx="312" cy="244" r="42" fill="#fff" stroke="#111827" stroke-width="2"/>
  <text x="312" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">M</text>
  <rect x="210" y="226" width="54" height="34" rx="4" class="symbol"/>
  <text x="237" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">BE</text>
  <circle cx="190" cy="243" r="18" class="mark"/><text x="190" y="243" class="num">⑩</text>
  <rect x="84" y="380" width="592" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="116" cy="404" r="14" class="mark"/><text x="116" y="404" class="num" font-size="15">⑩</text>
  <text x="146" y="409" class="label" font-weight="700">対象位置</text>
  <text x="242" y="409" class="small">モータ回路に取り付けるブレーカの図記号を選ぶ。</text>
