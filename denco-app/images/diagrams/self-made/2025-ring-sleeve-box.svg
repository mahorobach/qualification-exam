<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">ジョイントボックス内の接続模式図</title><desc id="desc">リングスリーブと差込形コネクタの数を考えるための自作図。公式図面のトレースではない。</desc><rect width="760" height="360" fill="#f8fafc"/><rect x="70" y="45" width="300" height="240" rx="14" fill="#fff" stroke="#334155" stroke-width="4"/><g stroke="#2563eb" stroke-width="5" fill="none"><path d="M20 105h180"/><path d="M20 165h180"/><path d="M20 225h180"/><path d="M240 105h180"/><path d="M240 165h180"/><path d="M240 225h180"/></g><g fill="#f59e0b" stroke="#92400e" stroke-width="3"><ellipse cx="210" cy="105" rx="24" ry="13"/><ellipse cx="210" cy="165" rx="24" ry="13"/><ellipse cx="210" cy="225" rx="24" ry="13"/></g><g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif" fill="#111827" font-size="20"><text x="90" y="330">VVF1.6のみ、同色ごとに接続</text><text x="450" y="92">小: 1.6mm 2〜4本など</text><text x="450" y="132">中: 本数が多い接続</text><text x="450" y="190">接続点ごとに</text><text x="450" y="222">スリーブまたは</text><text x="450" y="254">コネクタを数える</text></g></svg>
