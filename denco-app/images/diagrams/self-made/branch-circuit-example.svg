    <text x="322" y="330" font-size="15">接地側</text>
    <text x="576" y="256" font-size="16" font-weight="700">片切SW</text>
    <text x="714" y="70" font-size="16" font-weight="700">照明器具</text>
    <text x="716" y="250" font-size="16" font-weight="700">コンセント</text>
    <text x="72" y="430" font-size="16">注: 接続関係の理解用に作成した独自図面。公式試験図面のトレースではありません。</text>
  </g>
</svg>
