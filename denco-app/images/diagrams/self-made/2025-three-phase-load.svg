<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" role="img" aria-labelledby="title desc">
<title id="title">三相3線式Y結線負荷回路</title>
<desc id="desc">三相3線式200V・Y結線で各相8Ω+6Ω直列の回路図（令和7年度上期 問5）</desc>
<rect width="700" height="340" fill="#f8fafc"/>

<!-- Source label -->
<text x="52" y="30" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" fill="#111827" font-weight="bold">3φ3W 200V電源</text>

<!-- Three source lines on left -->
<line x1="80" y1="60" x2="200" y2="60" stroke="#1f2937" stroke-width="3"/>
<line x1="80" y1="170" x2="200" y2="170" stroke="#1f2937" stroke-width="3"/>
<line x1="80" y1="280" x2="200" y2="280" stroke="#1f2937" stroke-width="3"/>

<!-- I[A] arrows on lines -->
<text x="110" y="50" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" fill="#2563eb">I [A]→</text>
<text x="110" y="160" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" fill="#2563eb">I [A]→</text>
<text x="110" y="270" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="16" fill="#2563eb">I [A]→</text>

<!-- Phase A: 8Ω + 6Ω -->
<rect x="200" y="44" width="70" height="32" rx="4" fill="#fff" stroke="#1f2937" stroke-width="2.5"/>
<text x="235" y="66" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" text-anchor="middle" fill="#111827">8 Ω</text>
<line x1="270" y1="60" x2="310" y2="60" stroke="#1f2937" stroke-width="3"/>
<rect x="310" y="44" width="70" height="32" rx="4" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
<text x="345" y="66" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" text-anchor="middle" fill="#dc2626">6 Ω</text>
<line x1="380" y1="60" x2="460" y2="60" stroke="#1f2937" stroke-width="3"/>

<!-- Phase B: 8Ω + 6Ω -->
<rect x="200" y="154" width="70" height="32" rx="4" fill="#fff" stroke="#1f2937" stroke-width="2.5"/>
<text x="235" y="176" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" text-anchor="middle" fill="#111827">8 Ω</text>
<line x1="270" y1="170" x2="310" y2="170" stroke="#1f2937" stroke-width="3"/>
<rect x="310" y="154" width="70" height="32" rx="4" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
<text x="345" y="176" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" text-anchor="middle" fill="#dc2626">6 Ω</text>
<line x1="380" y1="170" x2="460" y2="170" stroke="#1f2937" stroke-width="3"/>

<!-- Phase C: 8Ω + 6Ω -->
<rect x="200" y="264" width="70" height="32" rx="4" fill="#fff" stroke="#1f2937" stroke-width="2.5"/>
<text x="235" y="286" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" text-anchor="middle" fill="#111827">8 Ω</text>
<line x1="270" y1="280" x2="310" y2="280" stroke="#1f2937" stroke-width="3"/>
<rect x="310" y="264" width="70" height="32" rx="4" fill="#fff" stroke="#dc2626" stroke-width="2.5"/>
<text x="345" y="286" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" text-anchor="middle" fill="#dc2626">6 Ω</text>
<line x1="380" y1="280" x2="460" y2="280" stroke="#1f2937" stroke-width="3"/>

<!-- Y-connection neutral point -->
<line x1="460" y1="60" x2="520" y2="170" stroke="#1f2937" stroke-width="2.5"/>
<line x1="460" y1="170" x2="520" y2="170" stroke="#1f2937" stroke-width="2.5"/>
<line x1="460" y1="280" x2="520" y2="170" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="520" cy="170" r="7" fill="#6b7280"/>
<text x="535" y="175" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#6b7280">中性点</text>

<!-- Legend -->
<rect x="560" y="44" width="20" height="20" rx="2" fill="#fff" stroke="#1f2937" stroke-width="2"/>
<text x="585" y="60" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#111827">抵抗</text>
<rect x="560" y="74" width="20" height="20" rx="2" fill="#fff" stroke="#dc2626" stroke-width="2"/>
<text x="585" y="90" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" fill="#dc2626">リアクタンス</text>

<!-- Formula hint -->
<text x="50" y="320" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="13" fill="#6b7280">Z=√(8²+6²)=10Ω、相電圧=200/√3≈115.5V → I=115.5/10≈11.6A</text>
</svg>
