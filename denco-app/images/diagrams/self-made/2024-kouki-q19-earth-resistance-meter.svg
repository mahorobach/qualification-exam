<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="title desc">
  <title id="title">2024年後期 問題19 ⑪接地抵抗測定</title>
  <desc id="desc">2024年度後期配線図の⑪に示す接地極の抵抗測定対象を読み取りやすくした学習用自作図。測定器名は図示しない。</desc>
  <style>text{font-family:Arial,"Hiragino Sans","Yu Gothic",sans-serif}.area{fill:#ecf8ee;stroke:#64748b;stroke-width:1.8}.earth{stroke:#16a34a;stroke-width:3;fill:none}.lead{stroke:#111827;stroke-width:2;fill:none}.mark{fill:#fff;stroke:#2563eb;stroke-width:3}.num{font-size:18px;font-weight:700;fill:#1d4ed8;text-anchor:middle;dominant-baseline:central}.small{font-size:12px;fill:#475569}.label{font-size:15px;fill:#334155}.title{font-size:20px;font-weight:700;fill:#0f172a;text-anchor:middle}</style>
  <rect width="760" height="460" fill="#fff"/>
  <rect x="28" y="22" width="704" height="58" rx="10" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="380" y="47" class="title">2024年度後期 配線図（学習用模式図）</text>
  <text x="380" y="69" text-anchor="middle" class="small">⑪で示す接地極の抵抗測定を確認するための整理図</text>
  <rect x="96" y="116" width="430" height="220" rx="4" class="area"/>
  <text x="312" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">接地極</text>
  <path d="M312 176v74M286 250h52M296 265h32M306 279h12" class="earth"/>
  <path d="M312 176 C430 176 462 230 462 280" class="lead"/>
  <rect x="424" y="280" width="76" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="462" y="307" text-anchor="middle" class="small">測定器</text>
  <circle cx="274" cy="210" r="18" class="mark"/><text x="274" y="210" class="num">⑪</text>
  <rect x="84" y="380" width="592" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <circle cx="116" cy="404" r="14" class="mark"/><text x="116" y="404" class="num" font-size="15">⑪</text>
  <text x="146" y="409" class="label" font-weight="700">対象位置</text>
  <text x="242" y="409" class="small">接地極の抵抗を測定する器具を選ぶ。</text>
</svg>
