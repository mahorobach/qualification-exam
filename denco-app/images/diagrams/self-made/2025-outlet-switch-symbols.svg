<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">コンセントとスイッチ傍記の整理</title><desc id="desc">コンセント・スイッチ記号の識別を学ぶための自作表。公式写真や公式図面のトレースではない。</desc><rect width="760" height="360" fill="#f8fafc"/><g transform="translate(50 55)"><rect width="660" height="240" fill="#fff" stroke="#334155"/><g stroke="#cbd5e1"><path d="M0 48h660M0 96h660M0 144h660M0 192h660"/><path d="M190 0v240M420 0v240"/></g><g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif" fill="#111827" font-size="18"><text x="40" y="31" font-weight="700">傍記</text><text x="225" y="31" font-weight="700">意味</text><text x="452" y="31" font-weight="700">覚える視点</text><text x="50" y="79">H</text><text x="225" y="79">引掛形</text><text x="452" y="79">プラグを回して固定</text><text x="50" y="127">WP</text><text x="225" y="127">防雨形</text><text x="452" y="127">屋外・水がかり</text><text x="50" y="175">E / ET</text><text x="225" y="175">接地端子 / 接地極</text><text x="452" y="175">接地の種類を区別</text><text x="50" y="223">0 / 1 / 3</text><text x="225" y="223">スイッチ接点</text><text x="452" y="223">未使用接点を見分ける</text></g></g></svg>
