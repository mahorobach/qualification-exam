<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" role="img" aria-labelledby="title desc">
<title id="title">問17 写真の器具（配線用遮断器 電動機保護兼用）</title>
<desc id="desc">配線用遮断器（電動機保護兼用）のイラスト。熱動電磁式でモーター保護機能を持つ。</desc>
<rect width="500" height="320" fill="#f8fafc"/>

<text x="250" y="28" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#111827">写真の器具の名称は。【正解：ハ】</text>

<!-- Main breaker body -->
<rect x="150" y="45" width="200" height="200" rx="8" fill="#37474f" stroke="#263238" stroke-width="3"/>

<!-- Top terminals -->
<rect x="170" y="38" width="30" height="20" rx="3" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>
<rect x="235" y="38" width="30" height="20" rx="3" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>
<rect x="300" y="38" width="30" height="20" rx="3" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>

<!-- Bottom terminals -->
<rect x="170" y="232" width="30" height="20" rx="3" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>
<rect x="235" y="232" width="30" height="20" rx="3" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>
<rect x="300" y="232" width="30" height="20" rx="3" fill="#9e9e9e" stroke="#616161" stroke-width="1.5"/>

<!-- Face plate -->
<rect x="162" y="58" width="176" height="175" rx="4" fill="#546e7a" stroke="#37474f" stroke-width="1"/>

<!-- Rating label area -->
<rect x="168" y="64" width="164" height="36" rx="3" fill="#eceff1" stroke="#b0bec5" stroke-width="1"/>
<text x="250" y="78" font-family="Arial,'Courier New',monospace" font-size="11" text-anchor="middle" fill="#111827">AC100-220V  10A</text>
<text x="250" y="93" font-family="Arial,'Courier New',monospace" font-size="10" text-anchor="middle" fill="#111827">電動機保護兼用</text>

<!-- Handle (ON position) -->
<rect x="220" y="108" width="60" height="50" rx="6" fill="#ff7043" stroke="#e64a19" stroke-width="2"/>
<text x="250" y="130" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="13" text-anchor="middle" fill="white" font-weight="bold">ON</text>
<text x="250" y="148" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="white">↑</text>

<!-- Trip indicator window -->
<rect x="215" y="165" width="70" height="20" rx="3" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
<text x="250" y="180" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="11" text-anchor="middle" fill="#e65100">Trip表示</text>

<!-- Test button -->
<circle cx="250" cy="215" r="12" fill="#b0bec5" stroke="#78909c" stroke-width="2"/>
<text x="250" y="219" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="9" text-anchor="middle" fill="#263238">TEST</text>

<!-- Pole label -->
<text x="162" y="265" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="13" fill="#eceff1">3P</text>

<!-- Caption -->
<text x="250" y="282" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#1d4ed8">配線用遮断器（電動機保護兼用）</text>
<text x="250" y="300" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">過電流・短絡保護＋電動機の始動電流対応</text>
<text x="250" y="316" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" font-size="12" text-anchor="middle" fill="#6b7280">電磁式ではなく熱動電磁式（漏電保護なし）</text>
</svg>
