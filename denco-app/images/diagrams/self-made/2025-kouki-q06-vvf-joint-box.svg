<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="100%" style="max-width:640px" font-family="sans-serif">
  <desc>2025年度下期 問題6用。配線図中の⑥、円形のVVF表示がある図記号を読み取りやすくした学習用拡大図。</desc>
  <rect width="640" height="520" fill="#f9f9f6"/>

  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="28" y="36" font-size="18" font-weight="bold" fill="#1f2937">配線図 ⑥ 拡大図</text>
  <text x="28" y="60" font-size="12" fill="#4b5563">円形の記号に「VVF」の表示がある箇所を確認する図</text>

  <!-- Main room crop -->
  <rect x="36" y="92" width="398" height="344" rx="4" fill="white" stroke="#555" stroke-width="1.5"/>
  <text x="235" y="122" text-anchor="middle" font-size="14" fill="#555">1階 居間</text>

  <!-- Adjacent hints -->
  <rect x="36" y="92" width="398" height="36" fill="#f3f4f6" stroke="#555" stroke-width="1.5"/>
  <line x1="36" y1="128" x2="434" y2="128" stroke="#555" stroke-width="1"/>
  <text x="56" y="116" font-size="10" fill="#6b7280">上部：100V幹線</text>

  <!-- Wiring in living room -->
  <line x1="236" y1="92" x2="236" y2="190" stroke="#cc0000" stroke-width="2"/>
  <circle cx="236" cy="202" r="16" fill="#fff7c7" stroke="#aa8800" stroke-width="1.6"/>
  <line x1="225" y1="191" x2="247" y2="213" stroke="#aa8800" stroke-width="1.4"/>
  <line x1="247" y1="191" x2="225" y2="213" stroke="#aa8800" stroke-width="1.4"/>
  <text x="236" y="236" text-anchor="middle" font-size="11" fill="#6b7280">照明</text>

  <line x1="236" y1="218" x2="286" y2="268" stroke="#cc0000" stroke-width="2"/>
  <line x1="306" y1="292" x2="250" y2="354" stroke="#cc0000" stroke-width="2"/>
  <line x1="238" y1="368" x2="96" y2="312" stroke="#cc0000" stroke-width="2"/>
  <line x1="238" y1="368" x2="96" y2="400" stroke="#cc0000" stroke-width="2"/>

  <!-- Switch / receptacle symbols retained as context -->
  <line x1="96" y1="312" x2="132" y2="312" stroke="#555" stroke-width="2"/>
  <line x1="96" y1="304" x2="96" y2="320" stroke="#555" stroke-width="2"/>
  <line x1="96" y1="400" x2="132" y2="400" stroke="#555" stroke-width="2"/>
  <line x1="96" y1="392" x2="96" y2="408" stroke="#555" stroke-width="2"/>
  <text x="142" y="316" font-size="11" fill="#6b7280">コンセント</text>
  <text x="142" y="404" font-size="11" fill="#6b7280">コンセント</text>

  <!-- Target VVF symbol -->
  <g filter="url(#soft-shadow)">
    <circle cx="306" cy="282" r="34" fill="#ffffff" stroke="#5f6673" stroke-width="2.6"/>
    <text x="306" y="288" text-anchor="middle" font-size="17" font-weight="bold" fill="#374151">VVF</text>
  </g>
  <circle cx="260" cy="244" r="18" fill="#e8f0ff" stroke="#3355aa" stroke-width="2"/>
  <text x="260" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#3355aa">⑥</text>

  <!-- Other junction box, smaller and subdued -->
  <rect x="238" y="354" width="26" height="22" rx="2" fill="#fffbea" stroke="#888" stroke-width="1.4"/>
  <circle cx="220" cy="366" r="14" fill="#eef2ff" stroke="#7890c8" stroke-width="1.5"/>
  <text x="220" y="371" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b6fa8">⑰</text>
  <text x="270" y="370" font-size="11" fill="#6b7280">ク・ケ方向</text>

  <!-- Callout -->
  <path d="M458 168 H594 Q606 168 606 180 V286 Q606 298 594 298 H458 Q446 298 446 286 V180 Q446 168 458 168 Z" fill="#fffdf3" stroke="#d6a300" stroke-width="1.6"/>
  <text x="472" y="196" font-size="14" font-weight="bold" fill="#374151">読み取りポイント</text>
  <text x="472" y="224" font-size="13" fill="#374151">⑥が指しているのは</text>
  <text x="472" y="247" font-size="13" fill="#374151">四角ではなく、</text>
  <text x="472" y="270" font-size="13" fill="#374151">「VVF」と書かれた</text>
  <text x="472" y="291" font-size="13" fill="#374151">円形記号。</text>
  <line x1="446" y1="244" x2="342" y2="282" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Mini full-plan locator -->
  <rect x="462" y="330" width="132" height="96" rx="3" fill="white" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="528" y="348" text-anchor="middle" font-size="10" fill="#6b7280">全体図での位置</text>
  <rect x="476" y="360" width="42" height="24" fill="#f3f4f6" stroke="#9ca3af" stroke-width="0.8"/>
  <rect x="522" y="360" width="56" height="52" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/>
  <rect x="476" y="388" width="42" height="24" fill="#ffffff" stroke="#9ca3af" stroke-width="0.8"/>
  <circle cx="550" cy="388" r="8" fill="#e8f0ff" stroke="#3355aa" stroke-width="1.4"/>
  <text x="550" y="392" text-anchor="middle" font-size="8" font-weight="bold" fill="#3355aa">⑥</text>
  <text x="550" y="421" text-anchor="middle" font-size="9" fill="#6b7280">1階 居間</text>

  <!-- Legend -->
  <line x1="36" y1="466" x2="82" y2="466" stroke="#cc0000" stroke-width="2"/>
  <text x="92" y="470" font-size="11" fill="#4b5563">単相100V回路</text>
  <circle cx="212" cy="466" r="9" fill="#fff7c7" stroke="#aa8800" stroke-width="1.2"/>
  <line x1="206" y1="460" x2="218" y2="472" stroke="#aa8800" stroke-width="1"/>
  <line x1="218" y1="460" x2="206" y2="472" stroke="#aa8800" stroke-width="1"/>
  <text x="230" y="470" font-size="11" fill="#4b5563">照明器具</text>
  <circle cx="330" cy="466" r="12" fill="white" stroke="#5f6673" stroke-width="1.6"/>
  <text x="330" y="470" text-anchor="middle" font-size="8" font-weight="bold" fill="#374151">VVF</text>
  <text x="350" y="470" font-size="11" fill="#4b5563">問題の円形記号</text>
</svg>
