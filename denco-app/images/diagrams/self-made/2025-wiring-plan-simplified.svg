<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-labelledby="title desc"><title id="title">集合住宅共用部の簡略配線図</title><desc id="desc">2025年上期の配線図テーマを学習用に再構成した自作簡略図。公式図面の配置や紙面はトレースしていない。</desc><rect width="820" height="460" fill="#f8fafc"/><g fill="#fff" stroke="#334155" stroke-width="3"><rect x="45" y="55" width="330" height="300"/><rect x="445" y="55" width="330" height="300"/></g><g stroke="#2563eb" stroke-width="4" fill="none"><path d="M90 120h230v70H90z"/><path d="M490 120h230v70H490z"/><path d="M90 250h230"/><path d="M490 250h230"/><path d="M330 210c60 0 85 0 120 0" stroke-dasharray="8 8"/></g><g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif" fill="#111827"><text x="45" y="38" font-size="22" font-weight="700">1階 共用廊下</text><text x="445" y="38" font-size="22" font-weight="700">地下1階 ポンプ室</text><text x="105" y="112" font-size="18">DL</text><text x="170" y="112" font-size="18">3ア</text><text x="245" y="112" font-size="18">WP</text><text x="105" y="242" font-size="18">S a</text><text x="505" y="112" font-size="18">P1 M</text><text x="610" y="112" font-size="18">P2 M</text><text x="505" y="242" font-size="18">FS</text><text x="600" y="242" font-size="18">TS</text><text x="77" y="390" font-size="16">凡例: 破線=制御配線 / B=配線用遮断器 / BE=漏電遮断器</text><text x="78" y="424" font-size="16">問31-50用の独自簡略図。詳細平面ではなく論点確認用。</text></g><g fill="#ef4444"><circle cx="90" cy="120" r="6"/><circle cx="490" cy="120" r="6"/><circle cx="490" cy="250" r="6"/></g></svg>
