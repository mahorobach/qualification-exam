<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-labelledby="title desc">
  <title id="title">2024年後期 問題14 ⑥単相3線式分岐回路</title>
  <desc id="desc">2024年度後期配線図の⑥に示す単相3線式100/200V分岐回路を読み取りやすくした学習用自作図。禁止される遮断装置名は図中に表示しない。</desc>
  <style>
    text { font-family: Arial, "Hiragino Sans", "Yu Gothic", sans-serif; }
    .factory { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }
    .panel { fill: #dbeafe; stroke: #1e3a8a; stroke-width: 2; }
    .box { fill: #ffffff; stroke: #111827; stroke-width: 2.4; }
    .line1 { stroke: #111827; stroke-width: 4; stroke-linecap: round; }
    .neutral { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
    .line2 { stroke: #dc2626; stroke-width: 4; stroke-linecap: round; }
    .mark { fill: #fff; stroke: #2563eb; stroke-width: 3; }
    .num { font-size: 18px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; dominant-baseline: central; }
    .label { font-size: 15px; fill: #334155; }
    .small { font-size: 12px; fill: #475569; }
    .room-name { font-size: 17px; font-weight: 700; fill: #334155; text-anchor: middle; }
  </style>

  <rect width="760" height="500" fill="#ffffff"/>

  <rect x="28" y="22" width="704" height="58" rx="10" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="380" y="47" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">2024年度後期 配線図（学習用模式図）</text>
  <text x="380" y="69" text-anchor="middle" font-size="13" fill="#475569">⑥で示す単相3線式100/200V分岐回路を確認するための整理図</text>

  <!-- Context -->
  <rect x="82" y="116" width="420" height="220" class="factory" rx="4"/>
  <text x="292" y="230" class="room-name">1階工場</text>
  <rect x="134" y="138" width="68" height="34" rx="4" class="panel"/>
  <text x="168" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">L-1</text>
  <rect x="300" y="250" width="38" height="28" rx="3" class="box"/>
  <text x="319" y="269" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">⑥</text>
  <circle cx="286" cy="264" r="18" class="mark"/>
  <text x="286" y="264" class="num">⑥</text>
  <line x1="202" y1="155" x2="300" y2="155" class="line1"/>
  <line x1="202" y1="170" x2="300" y2="170" class="neutral"/>
  <line x1="202" y1="185" x2="300" y2="185" class="line2"/>
  <line x1="319" y1="250" x2="319" y2="185" class="line1"/>

  <!-- Enlarged circuit -->
  <rect x="430" y="120" width="250" height="210" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="555" y="153" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">⑥ 分岐回路</text>
  <text x="555" y="176" text-anchor="middle" class="small">1φ3W 100/200V</text>
  <line x1="478" y1="218" x2="632" y2="218" class="line1"/>
  <line x1="478" y1="244" x2="632" y2="244" class="neutral"/>
  <line x1="478" y1="270" x2="632" y2="270" class="line2"/>
  <rect x="512" y="200" width="86" height="88" rx="8" class="box"/>
  <line x1="538" y1="200" x2="538" y2="288" stroke="#111827" stroke-width="2"/>
  <line x1="572" y1="200" x2="572" y2="288" stroke="#111827" stroke-width="2"/>
  <text x="555" y="316" text-anchor="middle" class="small">両側の電圧線を同時に扱う回路</text>

  <rect x="84" y="402" width="592" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g transform="translate(116 430)">
    <circle cx="0" cy="0" r="14" class="mark"/>
    <text x="0" y="0" class="num" font-size="15">⑥</text>
    <text x="30" y="-5" class="label" font-weight="700">対象位置</text>
    <text x="30" y="19" class="small">単相3線式100/200Vの分岐回路。施設してはならない遮断装置を選ぶ。</text>
  </g>
</svg>
