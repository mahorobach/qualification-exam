<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Self-made wire count slash diagram</title>
  <desc id="desc">Original simplified diagram explaining slash marks on wiring lines. This is not copied from official exam figures.</desc>
  <rect width="900" height="360" fill="#fff"/>
  <g fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round">
    <line x1="120" y1="150" x2="360" y2="150"/>
    <line x1="540" y1="150" x2="780" y2="150"/>
    <line x1="630" y1="120" x2="608" y2="180"/>
    <line x1="668" y1="120" x2="646" y2="180"/>
    <line x1="706" y1="120" x2="684" y2="180"/>
  </g>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif" fill="#111827">
    <text x="52" y="52" font-size="24" font-weight="700">電線本数の斜線表示（自作整理図）</text>
    <text x="124" y="112" font-size="18" fill="#374151">線上に本数指定なし</text>
    <text x="126" y="210" font-size="24" font-weight="700">原則2本として読む</text>
    <text x="548" y="112" font-size="18" fill="#374151">斜線で本数指定あり</text>
    <text x="548" y="210" font-size="24" font-weight="700">指定があればそれに従う</text>
    <path d="M428 145h64" stroke="#64748b" stroke-width="3"/>
    <path d="M492 145l-14 -12M492 145l-14 12" stroke="#64748b" stroke-width="3" fill="none"/>
    <text x="410" y="276" font-size="18" fill="#374151">この問題では左側の「省略表示」を問う</text>
    <text x="52" y="334" font-size="15">注: 学習用に作成した独自模式図。公式試験図面のトレースではありません。</text>
  </g>
</svg>
