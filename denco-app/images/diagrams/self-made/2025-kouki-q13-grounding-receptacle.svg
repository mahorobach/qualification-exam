<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="100%" style="max-width:640px" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">配線図 ⑬ 接地極付コンセント</title>
  <desc id="desc">2025年度下期配線図の⑬、ベランダにあるE傍記の接地極付コンセントを読み取りやすくした学習用拡大図。</desc>
  <rect width="640" height="500" fill="#f8fafc"/>
  <defs><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker></defs>
  <text x="28" y="36" font-size="18" font-weight="bold" fill="#111827">配線図 ⑬ 拡大図</text>
  <text x="28" y="60" font-size="12" fill="#4b5563">ベランダの「E」傍記付きコンセント記号を確認する図</text>
  <rect x="36" y="88" width="392" height="318" rx="5" fill="#eef9ff" stroke="#4488aa" stroke-width="1.6"/>
  <text x="232" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#336f8d">2階 ベランダ</text>
  <rect x="118" y="164" width="118" height="66" rx="5" fill="white" stroke="#0000cc" stroke-width="2"/>
  <text x="177" y="204" text-anchor="middle" font-size="18" fill="#0000cc">RC</text>
  <text x="122" y="258" font-size="13" font-weight="bold" fill="#0000cc">200V 20A</text>
  <line x1="236" y1="197" x2="352" y2="197" stroke="#1f2937" stroke-width="2.2"/>
  <line x1="310" y1="188" x2="310" y2="206" stroke="#1f2937" stroke-width="2.2"/>
  <text x="356" y="201" font-size="17" font-weight="bold" fill="#374151">E</text>
  <circle cx="380" cy="184" r="22" fill="#e8f0ff" stroke="#3355aa" stroke-width="2.2"/>
  <text x="380" y="192" text-anchor="middle" font-size="19" font-weight="bold" fill="#3355aa">⑬</text>
  <line x1="366" y1="184" x2="326" y2="194" stroke="#cc0000" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="102" y="300" width="260" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="122" y="326" font-size="13" font-weight="bold" fill="#111827">記号の読み取り</text>
  <text x="122" y="350" font-size="13" fill="#374151">傍記は「E」のみ</text>
  <text x="122" y="368" font-size="12" fill="#6b7280">ET / EET などの傍記はない</text>
  <path d="M454 124 H594 Q606 124 606 136 V280 Q606 292 594 292 H454 Q442 292 442 280 V136 Q442 124 454 124 Z" fill="#fffdf3" stroke="#d6a300" stroke-width="1.6"/>
  <text x="468" y="153" font-size="14" font-weight="bold" fill="#374151">写真で見るポイント</text>
  <text x="468" y="181" font-size="13" fill="#374151">写真では下部の</text>
  <text x="468" y="204" font-size="13" fill="#374151">接地用の穴を見る。</text>
  <text x="468" y="232" font-size="13" fill="#374151">接地端子ねじ付きなら</text>
  <text x="468" y="255" font-size="13" fill="#374151">ET / EET も確認。</text>
  <rect x="480" y="330" width="80" height="96" rx="8" fill="white" stroke="#9ca3af" stroke-width="1.6"/>
  <rect x="505" y="354" width="12" height="34" rx="5" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
  <rect x="523" y="354" width="12" height="34" rx="5" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
  <circle cx="520" cy="404" r="9" fill="#eef2ff" stroke="#3355aa" stroke-width="1.5"/>
  <text x="520" y="446" text-anchor="middle" font-size="11" fill="#4b5563">接地極</text>
  <line x1="36" y1="456" x2="82" y2="456" stroke="#1f2937" stroke-width="2.4"/>
  <text x="94" y="460" font-size="11" fill="#4b5563">コンセント記号</text>
  <text x="236" y="460" font-size="13" font-weight="bold" fill="#374151">E</text>
  <text x="256" y="460" font-size="11" fill="#4b5563">傍記を選択肢と照合</text>
</svg>
