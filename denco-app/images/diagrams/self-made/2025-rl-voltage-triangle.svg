<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">交流負荷の電圧三角形</title><desc id="desc">RL負荷の電圧関係を示す自作模式図。公式図面のトレースではない。</desc><rect width="640" height="300" fill="#f8fafc"/><g stroke="#1f2937" stroke-width="4" fill="none"><path d="M120 220h310V80Z"/><path d="M120 220h350" marker-end="url(#a)"/><path d="M120 220V60" marker-end="url(#a)"/></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/></marker></defs><g font-family="Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif" fill="#111827"><text x="245" y="248" font-size="22">抵抗側電圧 90V</text><text x="444" y="155" font-size="22">リアクタンス側 48V</text><text x="250" y="126" font-size="24" fill="#2563eb">電源電圧 102V</text><text x="72" y="46" font-size="18">位相差</text></g></svg>
