<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="title desc">
  <title id="title">2024年後期 問題10 ⑬VVF用ジョイントボックス</title>
  <desc id="desc">2024年度後期配線図の⑬に示すVVF用ジョイントボックス内の接続本数を読み取りやすくした学習用自作図。</desc>
  <style>
    text { font-family: Arial, "Hiragino Sans", "Yu Gothic", sans-serif; }
    .floor { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }
    .office { fill: #ecf8ee; stroke: #64748b; stroke-width: 1.5; }
    .hall { fill: #f7f1e2; stroke: #64748b; stroke-width: 1.5; }
    .box { fill: #fff7dc; stroke: #111827; stroke-width: 2.5; }
    .wire-b { fill: none; stroke: #111827; stroke-width: 5; stroke-linecap: round; }
    .wire-w { fill: none; stroke: #94a3b8; stroke-width: 5; stroke-linecap: round; }
    .wire-r { fill: none; stroke: #dc2626; stroke-width: 5; stroke-linecap: round; }
    .joint2 { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .joint3 { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .mark { fill: #fff; stroke: #2563eb; stroke-width: 3; }
    .num { font-size: 18px; font-weight: 700; fill: #1d4ed8; text-anchor: middle; dominant-baseline: central; }
    .label { font-size: 15px; fill: #334155; }
    .small { font-size: 12px; fill: #475569; }
    .room-name { font-size: 17px; font-weight: 700; fill: #334155; text-anchor: middle; }
  </style>

  <rect width="760" height="520" fill="#ffffff"/>

  <rect x="28" y="22" width="704" height="58" rx="10" fill="#eaf2ff" stroke="#bfdbfe"/>
  <text x="380" y="47" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">2024年度後期 配線図（学習用模式図）</text>
  <text x="380" y="69" text-anchor="middle" font-size="13" fill="#475569">⑬のVVF用ジョイントボックス内の接続本数を確認するための整理図</text>

  <!-- Simplified second floor area -->
  <rect x="78" y="112" width="430" height="160" class="floor" rx="4"/>
  <rect x="92" y="126" width="230" height="132" class="office"/>
  <text x="207" y="198" class="room-name">2階事務室</text>
  <rect x="334" y="126" width="158" height="84" class="hall"/>
  <text x="413" y="174" class="room-name" font-size="15">イロハ</text>

  <!-- Target location -->
  <rect x="238" y="111" width="34" height="34" rx="3" class="box"/>
  <circle cx="255" cy="128" r="18" class="mark"/>
  <text x="255" y="128" class="num">⑬</text>

  <!-- Enlarged junction box -->
  <rect x="112" y="306" width="536" height="142" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="334" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">⑬ ボックス内の接続点</text>

  <!-- 2-wire connections x3 -->
  <g transform="translate(155 370)">
    <path d="M0 0 H54" class="wire-b"/>
    <path d="M0 28 H54" class="wire-w"/>
    <rect x="54" y="-12" width="54" height="52" rx="8" class="joint2"/>
    <path d="M108 0 H162" class="wire-b"/>
    <path d="M108 28 H162" class="wire-w"/>
    <text x="81" y="72" text-anchor="middle" class="small">2本接続</text>
  </g>
  <g transform="translate(320 370)">
    <path d="M0 0 H54" class="wire-b"/>
    <path d="M0 28 H54" class="wire-w"/>
    <rect x="54" y="-12" width="54" height="52" rx="8" class="joint2"/>
    <path d="M108 0 H162" class="wire-b"/>
    <path d="M108 28 H162" class="wire-w"/>
    <text x="81" y="72" text-anchor="middle" class="small">2本接続</text>
  </g>
  <g transform="translate(485 370)">
    <path d="M0 0 H36" class="wire-b"/>
    <path d="M0 28 H36" class="wire-w"/>
    <rect x="36" y="-12" width="54" height="52" rx="8" class="joint2"/>
    <path d="M90 0 H126" class="wire-b"/>
    <path d="M90 28 H126" class="wire-w"/>
    <text x="63" y="72" text-anchor="middle" class="small">2本接続</text>
  </g>

  <!-- 3-wire connection -->
  <g transform="translate(420 185)">
    <path d="M0 0 H72" class="wire-b"/>
    <path d="M0 24 H72" class="wire-w"/>
    <path d="M0 48 H72" class="wire-r"/>
    <rect x="72" y="-12" width="62" height="72" rx="10" class="joint3"/>
    <path d="M134 0 H202" class="wire-b"/>
    <path d="M134 24 H202" class="wire-w"/>
    <path d="M134 48 H202" class="wire-r"/>
    <text x="103" y="92" text-anchor="middle" class="small">3本接続</text>
  </g>

  <rect x="84" y="466" width="592" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <g transform="translate(116 484)">
    <circle cx="0" cy="0" r="13" class="mark"/>
    <text x="0" y="0" class="num" font-size="14">⑬</text>
    <text x="30" y="5" class="label" font-weight="700">対象位置</text>
    <text x="126" y="5" class="small">各接続点の本数に合う差込形コネクタを選ぶ。</text>
  </g>
</svg>
