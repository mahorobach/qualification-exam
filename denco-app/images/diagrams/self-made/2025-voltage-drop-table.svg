<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" width="100%" style="max-width:740px" role="img" aria-labelledby="title desc" font-family="Arial,'Hiragino Sans','Yu Gothic',sans-serif">
  <title id="title">単相2線式回路の電圧降下と導体抵抗表</title>
  <desc id="desc">単相2線式200V・配線長100m・負荷電流10A、電圧降下4V以内の最小電線断面積を求めるための整理図。</desc>
  <rect width="740" height="520" fill="#f8fafc"/>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,4 L8,0 L8,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="32" y="34" font-size="18" font-weight="bold" fill="#111827">単相2線式回路の電圧降下</text>
  <text x="32" y="58" font-size="13" fill="#4b5563">条件：1φ2W 200V、配線長100m、負荷電流10A、電圧降下4V以内</text>

  <!-- Circuit card -->
  <rect x="32" y="78" width="676" height="142" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="54" y="108" font-size="14" font-weight="bold" fill="#111827">回路条件</text>
  <circle cx="88" cy="150" r="24" fill="white" stroke="#1f2937" stroke-width="2.4"/>
  <text x="79" y="157" font-size="17" fill="#1f2937">〜</text>
  <text x="52" y="136" font-size="12" fill="#111827">Vs</text>
  <text x="52" y="168" font-size="12" fill="#111827">200V</text>

  <line x1="112" y1="136" x2="560" y2="136" stroke="#1f2937" stroke-width="3"/>
  <line x1="112" y1="166" x2="560" y2="166" stroke="#1f2937" stroke-width="3"/>
  <path d="M230 116 H422" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="326" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2563eb">負荷電流 10A</text>

  <line x1="112" y1="190" x2="560" y2="190" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>
  <text x="336" y="208" text-anchor="middle" font-size="13" fill="#6b7280">配線長 L = 100m = 0.1km</text>

  <rect x="560" y="124" width="78" height="56" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="599" y="148" text-anchor="middle" font-size="13" fill="#2563eb">抵抗</text>
  <text x="599" y="166" text-anchor="middle" font-size="13" fill="#2563eb">負荷</text>
  <text x="650" y="136" font-size="12" fill="#111827">Vr</text>

  <!-- Formula guide -->
  <rect x="32" y="236" width="676" height="82" rx="8" fill="#fffdf3" stroke="#d6a300" stroke-width="1.5"/>
  <text x="54" y="263" font-size="14" font-weight="bold" fill="#374151">計算で使う式</text>
  <text x="54" y="290" font-size="15" fill="#374151">単相2線式の電圧降下：</text>
  <text x="254" y="290" font-size="16" font-weight="bold" fill="#111827">Vs - Vr = 2 × r × L × I</text>
  <text x="496" y="290" font-size="13" fill="#4b5563">往復2線分なので 2倍</text>
  <text x="54" y="311" font-size="12" fill="#4b5563">表から導体抵抗 r [Ω/km] を選び、4V以内になる最小の断面積を選ぶ。</text>

  <!-- Table -->
  <rect x="32" y="336" width="676" height="146" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <rect x="32" y="336" width="676" height="34" fill="#e2e8f0" stroke="#334155" stroke-width="1"/>
  <text x="201" y="359" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">電線の太さ [mm²]</text>
  <text x="539" y="359" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">導体抵抗 r [Ω/km]</text>
  <line x1="370" y1="336" x2="370" y2="482" stroke="#334155" stroke-width="1.2"/>

  <line x1="32" y1="370" x2="708" y2="370" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="32" y1="398" x2="708" y2="398" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="32" y1="426" x2="708" y2="426" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="32" y1="454" x2="708" y2="454" stroke="#e5e7eb" stroke-width="1"/>

  <text x="201" y="389" text-anchor="middle" font-size="17" fill="#111827">5.5</text>
  <text x="539" y="389" text-anchor="middle" font-size="17" fill="#111827">3.33</text>
  <text x="201" y="417" text-anchor="middle" font-size="17" fill="#111827">8</text>
  <text x="539" y="417" text-anchor="middle" font-size="17" fill="#111827">2.31</text>
  <text x="201" y="445" text-anchor="middle" font-size="17" fill="#111827">14</text>
  <text x="539" y="445" text-anchor="middle" font-size="17" fill="#111827">1.30</text>
  <text x="201" y="473" text-anchor="middle" font-size="17" fill="#111827">22</text>
  <text x="539" y="473" text-anchor="middle" font-size="17" fill="#111827">0.82</text>

  <!-- Footer hint without answer highlighting -->
  <text x="32" y="505" font-size="12" fill="#6b7280">判定例：各行で 2×r×0.1×10 を計算し、4V以内になるものを小さい断面積から確認する。</text>
</svg>
